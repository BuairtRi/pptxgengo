      accelerator: AI can accelerate source analysis and coding throughout the modernization factory.
      transition: Testing, parallel operation, rollout and handoff remain explicit stages rather than a screen-only rewrite.
    brief: context/slide-038.md
    evidence_refs:
      - patterson-source
      - source-slide-038
    hidden: true
    notes: "\n\nOriginal authored content retained for provenance:\nsource-5-copy:\nWorking with your team (and our AI-tools and your source code), we’ve already identified the functional and \nnon-functional backlog that must be delivered.\n\nsource-8-copy:\n545 Total Functional Features\nFairly evenly split between WM (250) and Pantheon (235) contributions \n(not MECE)\nJointly identified scope: 51\nBroken up into 232 Epics\n54 Non-functional Requirements\nAll requirements are broken divided into 20 Business Capability Domains\n\nsource-6-copy:\nScalable, secure & maintainable enterprise architecture\n\ndomain-9-column-1-copy:\nCustomer Management\nOrder Management\nPricing\nComplaint Tracking\nPurchasing\nInventory\nWarehouse\nToll Customer\nScheduling\nQC Testing\n\ndomain-9-column-2-copy:\nMOTARS\nEngineering\nAP\nAR\nGL\nPayroll\nReporting\nSecurity & Access Control\nError Handling & Exceptions\nSystem Administration & Monitoring\n\ndraft-12-copy:\nUpdate\nModernization Factory- How priority workflows move from inventory through domain design, conversion, testing, parallel operation, rollout, and handoff. Including AI as an execution accelerator for analysis and coding. \nMilestones could include: inventory, prioritize, prove, migrate, scale"
  - id: patterson-039
    content_kind: supplied_content
    template:
      scope: local
      id: patterson-layout-039
    values:
      source-11-copy: Conceptual Future State Architecture
      source-4-copy: Co-develop a foundation that decouples PowerBuilder from direct database access and supports future browser delivery.
      source-5-copy: Reuse a governed service and domain foundation
      source-7-copy: |-
        Remove direct PowerBuilder database access
        Establish a stable API boundary and domain layer
        Govern PostgreSQL interaction centrally
        Preserve a path to future scale and security
      draft-12-copy: Reusable across desktop workflows, browser experiences and potential SaaS products; target decisions require validation.
    brief: context/slide-039.md
    evidence_refs:
      - patterson-source
      - source-slide-039
    hidden: true
    notes: "\n\nOriginal authored content retained for provenance:\nsource-11-copy:\nConceptual Future State Architecture\n\nsource-4-copy:\nWe’ll design and \nco-develop a scalable, flexible solution that will help enable Eaglesoft to transition from a database-coupled PowerBuilder architecture to a governed service and domain architecture that supports modernization and future browser-based deployment..\n\nsource-5-copy:\nScalable, secure & maintainable enterprise architecture\n\nsource-7-copy:\nWe’ll work hand-in-hand with you to design a future-state architecture that: \nRemoves direct database access from PowerBuilder\nIntroduces a stable service/API boundary\nEstablishes a domain-oriented application layer\nCentralizes and governs PostgreSQL data access\nAmong other changes to enable future scalability and security \n\ndraft-12-copy:\nUpdate\nReusable Data and API Foundation- Explain that the architecture is intended to be reused across PowerBuilder and desktop workflows, browser experiences, and SaaS products. Creates foundation for Saas Journey"
