  - id: patterson-003
    content_kind: supplied_content
    template:
      scope: shared
      id: understanding-drivers/central-ask
    values:
      slots:
        eyebrow: OUR UNDERSTANDING
        title: Modernize Eaglesoft without disruption
        source.text: Source proposal discussion; full source wording retained in notes.
        node01.label: Architecture
        node01.title: Separate the layers
        node01.body.item01.p: Create reusable services and APIs that decouple UI logic from governed data access.
        node02.label: Experience
        node02.title: Priority journeys
        node02.body.item01.p: Upgrade selected PowerBuilder workflows and UI experiences incrementally.
        node03.label: Patterson’s ask
        node03.title: A maintainable platform with future options
        node03.body.item01.p: Modernize the desktop product while preserving a path to browser or cloud capabilities.
        node03.body.item02.bullets.item01: PowerBuilder desktop dental platform
        node03.body.item02.bullets.item02: Business rules span UI, code and SQL
        node03.body.item02.bullets.item03: PostgreSQL environment already exists
        node04.label: Assurance
        node04.title: Release assurance
        node04.body.item01.p: Test desktop, APIs, services and infrastructure with telemetry and release gates.
        node05.label: Delivery
        node05.title: Product reliability
        node05.body.item01.p: Establish reusable layers without destabilizing Eaglesoft; preserve future browser and cloud options.
      keys:
        node01.body:
          - item-0
        node02.body:
          - item-0
        node03.body.item02.bullets:
          - item-0
          - item-1
          - item-2
        node03.body:
          - item-0
          - item-1
        node04.body:
          - item-0
        node05.body:
          - item-0
    brief: context/slide-003.md
    evidence_refs:
      - patterson-source
      - source-slide-003
    notes: "\n3\n\nOriginal authored content retained for provenance:\nsource-8-copy:\nOUR UNDERSTANDING\nPatterson is seeking to modernize Eaglesoft by creating a reusable data and API layer, upgrading selected PowerBuilder and UI workflows, and building automated performance testing to ensure the product remains reliable\n\nsource-20-copy:\nWhat We Heard\nEaglesoft is a desktop dental practice management platform built mainly on PowerBuilder\nPowerBuilder code still accesses SQL Anywhere directly through embedded SQL, DataWindows, dynamic SQL, and transaction logic\nRules are distributed across the UI, application code, database queries and stored procedures, making change and testing difficult\nA working PostgreSQL environment already exists, so the primary need is architectural decoupling and modernization\nThe platform needs a reusable service and API foundation that supports current desktop modernization while preserving options for future browser or SaaS development\n\nsource-22-copy:\nDesired Outcomes\nEstablish a reusable service and data layer that modernizes the UI and implements a 3-tier architecture to decouple UI logic from direct data access without destabilizing the current product\nInitiate an incremental modernization of priority workflows and selected UI experiences \nBuild automated full-stack performance testing, telemetry, and release gates to validate performance across the desktop, APIs, services, database, and infrastructure \nDevelop a maintainable platform with a path toward future browser or cloud capabilities"
