    brief: context/slide-033.md
    evidence_refs:
      - patterson-source
      - source-slide-033
    notes: "\n33\n\nOriginal authored content retained for provenance:\nsource-6-copy:\nTyler Giesting\nManaging Director, Healthcare M&A\n\nsource-7-copy:\nBackground \nTyler is a leader on West Monroe’s Healthcare M&A team, focusing on payer, provider and healthcare IT sectors. During his 10+ years at West Monroe, he’s supported 400+ transactions and has helped hundreds of private equity firms and portfolio companies assess, plan, and implement technology initiatives that advance growth objectives.\nTyler brings hands-on experience across multi-site, post-acute, and home-based services; revenue cycle and payment integrity; payer services and cost containment; EMR/PMS platforms; and value-based primary care models. \nIn 2025, he was named to M&A Advisors’ Emerging Leaders list and is a frequent source on healthcare M&A for CNBC, Axios, Modern Healthcare, and other leading outlets. Prior to joining WM, Tyler managed contact center operations and technology for a health system.\nWhat makes Tyler different\nA proud Indiana native, Tyler grew up during the heyday of Indiana college and pro basketball and enjoys catching a game when he can.\nWhere Tyler makes an impact\nAs a former healthcare operator, Tyler helps clients navigate complex and emerging industry dynamics to identify solutions that move the needle on cost, quality, and outcomes.\n\nsource-8-copy:\nIndustries served\nPayer & Provider Services\nHealthcare IT & Technology-Enabled Services\nPrivate Equity \n\nsource-9-copy:\nSkills & Specialties\nSell-side diligence & exit planning\nBuy-side diligence & M&A integration\nCommercial & competitive diligence\nValue identification & roadmap execution; product strategy; vendor selection & implementation \nLSS & process improvement "
  - id: patterson-034
    content_kind: supplied_content
    template:
      scope: shared
      id: bio-full/portrait-list
    values:
      slots:
        eyebrow: REPRESENTATIVE LEADERSHIP
        title: Dhaval Moogimane
        node01.photo: project:image69
        node02.text: Dhaval
