  - id: patterson-007
    content_kind: supplied_content
    template:
      scope: local
      id: patterson-layout-007
    values:
      source-7-copy: 'Two goals: separate the architecture and modernize the UI'
      source-3-copy: OUR PERSPECTIVE
      source-4-copy: Prioritize complete user journeys so modernization and testing support desirable, performant, validated changes.
      source-9-copy: VISION FOR THE FUTURE
      source-1095-copy: |-
        CURRENT STATE
        Practice-local PowerBuilder desktop
        UI, business logic and data access are coupled
        Devices and partners shape journey transitions
        Screen-only replacement preserves that coupling
      source-14-copy: A reusable application foundation
      source-17-copy: Independently maintainable experience, business operations and governed data access—with a journey-based PowerBuilder exit.
      source-5-copy: |-
        MODERNIZE THE UI
        Move toward a web-based UI that supports hiring and future deployment options; retire PowerBuilder incrementally.
      source-6-copy: |-
        SEPARATE THREE TIERS
        Maintain and upgrade UI, service/domain operations and data access independently.
      source-8-copy: |-
        DELIVER ON PREMISES
        React browser/PWA in the practice network; embedded or desktop routes remain transition options.
      source-12-copy: |-
        MOVE WHOLE JOURNEYS
        Pilot priority personas or roles, align end-to-end tests and minimize disruption within each journey.
    brief: context/slide-007.md
    evidence_refs:
      - patterson-source
      - source-slide-007
    notes: "\n\nOriginal authored content retained for provenance:\nsource-7-copy:\nWest Monroe recommends 2 goals for this modernization effort: aligning Eaglesoft to a classic 3-tier architecture and modernizing the user interface stack\n\nsource-3-copy:\nOUR PERSPECTIVE\n\nsource-4-copy:\nWest Monroe recommends taking a user-journey focused approach to the modernization program. But identifying and prioritizing user journeys, we can align the modernization and testing strategy approach to ensure that changes are desirable, performant and validated. \n\nsource-9-copy:\nVISION FOR THE FUTURE\n\nsource-1095-copy:\nCURRENT STATE\nPowerBuilder supports a practice-local application where the user experience, business behavior, and data access have grown together.\nThe user experience remains tied to a legacy desktop runtime.\nBusiness rules and transaction behavior span UI code and direct data paths.\nDevice and partner dependencies shape each journey transition.\nScreen-only replacement preserves the existing business and data coupling.\n\nsource-14-copy:\nAn independent application foundation\n\nsource-17-copy:\nOutcome\nAn independent user experience, reusable business operations, governed data access, and a clear path to PowerBuilder retirement.\n\nsource-5-copy:\nPOWERBUILDER RETIREMENT\nPowerBuilder has become a niche, legacy application stack. West Monroe recommends modernizing to a web-based user interface layer to ensure Pattern can continue to hire skilled engineers, to support a potential SaaS-ification of the product, and alignment with potential desktop and mobile deployment capabilities.\n\nsource-6-copy:\nTHREE-TIER RESPONSIBILITY\nModern application architecture practices over the last 15 years recommend a 3-tier structure: data access, service/domain, and user interface to ensure each layer can be maintained and upgraded separately. West Monroe recommends aligning to this high-level approach as an outcome of the modernization.\n\nsource-8-copy:\nWEB EXPERIENCE ON PREMISES\nReact provides browser or PWA delivery within the practice network. Embedded and desktop routes remain transition choices. WAN network support could potentially allow multi-site expansion for practices with that network capability. \n\nsource-12-copy:\nJOURNEY-LED DELIVERY\nBy using a journey-led approach, the disruption inside individual critical user journeys is minimized. Piloting specific personas or roles holistically can create a more seamless transition experience for customers. In addition, end to end testing for specific flows can be aligned with the testing workstream."
