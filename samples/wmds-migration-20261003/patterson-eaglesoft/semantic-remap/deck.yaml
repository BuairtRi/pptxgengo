  - id: patterson-029
    content_kind: supplied_content
    template:
      scope: local
      id: legacy-case-quote
    values:
      eyebrow: LEGACY 4GL CASE STUDY
      title: AI accelerated a legacy 4GL rebuild
      source: Source-reported results; not Eaglesoft outcomes. Full claim basis and quote in notes.
      node02.label: Challenge
      node02.body: A customized legacy product faced rising maintenance cost, delayed innovation and failed multi-year modernization attempts.
      node03.label: Approach
      node03.body: Assess the codebase with Intellio Evolve. Prototype a Java / Spring rewrite with Claude Code and AWS Kiro, guided by domain design, technical specifications and architecture steering files.
      node04.value: 6+ months
      node04.label: Planning condensed into weeks
      node05.value: ~10x
      node05.label: Architecture-team productivity
      node06.value: ~200K
      node06.label: Module LoC · one sprint
      node07.text: A big thank you to you and the West Monroe team.
      node07.by: Client CEO · excerpt; full quote in notes
    brief: context/slide-029.md
    evidence_refs:
      - patterson-source
      - source-slide-029
    notes: "Changed Aligned and excited architecture team by creating a holistic view of the architecture and dependencies\n to Aligned and energized the architecture team by establishing a clear, end-to-end view of the architecture and its dependencies.\n29\n\nOriginal authored content retained for provenance:\nsource-5-copy:\nOur client’s core product is built on legacy technologies and has been customized over time, increasing maintenance costs while losing market share and delaying innovation. Previous modernization efforts have taken multiple years and have failed due to the complexity of 4GL code transformation and migration strategies.\nHow we helped\nUsed an AI-first approach to evaluate the codebase and plan the strategic rewrite of one of the core modules \nUtilized Intellio Evolve alongside commercial AI tooling (Claude Code, AWS Kiro) to build a rapid prototype of a full rewrite to a modern language (Java / Spring) in a fraction of the time it would have taken with traditional approaches\nBest outcomes were driven by our approach using domain-driven design, technical specs, architecture steering files to guide AI agents with implementation\n\nsource-6-copy:\nBuilding Smarter Solutions to Modernize Legacy Code with AI\n\nsource-7-copy:\nAccelerated understanding, planning, and refactoring efforts of a legacy platform\n\nsource-18-copy:\nCase study\n\nsource-21-copy:\n6+\n\nsource-22-copy:\nmonths condensed into weeks\n\nsource-23-copy:\nPlanning the rebuild strategy was complex and the team couldn’t agree on a starting point. Using our agentic modernization approach supported by Intellio Evolve, we condensed an activity that had taken months into days\n\nsource-25-copy:\nA big thank you to you and the West Monroe team. We highly appreciate the partnership and all that WM has contributed to our current success. It would not have been possible without the team's work.\n—Client CEO\n\nsource-27-copy:\n10X\n\nsource-29-copy:\nOne of the platforms modules (~200K LoC) was targeted for transformation and performed inside a single sprint, an activity that would have taken 10 times longer using traditional approaches\n\nsource-12-copy:\nDrove ~10x improvement in architecture team productivity by creating a shared, end-to-end view of the architecture and dependencies—reducing discovery time and rework so the team could deliver more with less.\nProduced a highly granular build plan that would serve as the foundation for next-gen code generation\n\nsource-13-copy:\nCreated a repeatable, agentic workflow to serve as the go-forward development process\nEnabled ongoing refinement with the leadership team to fine-tune the build based on their domain expertise\n\nsource-20-copy:\nproductivity\nincrease"
  - id: patterson-030
    content_kind: supplied_content
    template:
      scope: local
      id: patterson-layout-030
    values:
      source-5-copy: International Wire Group’s VAX-based system created friction across factory and back-office work. Volt ERP established modern MUI patterns and a documented system that scales across domains.
      source-6-copy: Volt ERP replaced legacy friction with a reusable design system
      source-7-copy: 'Pantheon case evidence: MUI patterns, working prototypes and AI-assisted handoff'
      source-40-copy: Case study
      source-41-copy: '400+ '
      source-42-copy: Estimated screens for the full ERP
      source-47-copy: How We Helped
      source-11-copy: |-
        Document reusable MUI interactions
        Test edge cases in a working prototype
        Use Figma + Claude for structured developer handoff
        Maintain living documentation as components grow
      source-17-copy: '20+ '
      source-18-copy: Screens designed to establish reusable patterns
      source-20-copy: "1"
      source-21-copy: Documented design system
    brief: context/slide-030.md
    evidence_refs:
      - patterson-source
      - source-slide-030
    notes: "\n\nOriginal authored content retained for provenance:\nsource-5-copy:\nInternational Wire Group, a copper wire manufacturer, relied on a decades-old VAX-based mainframe system across QC, customer management, AP documents, and scheduling, creating friction for factory floor and back-office teams alike. We designed Volt ERP, a modern MUI-based platform, establishing reusable patterns like split panels, drawer editing, and multi-step forms across each domain. The result is a scalable, documented design system and an AI-assisted design-to-dev workflow that keeps specs and engineering in sync as the platform grows.\n\nsource-6-copy:\nPantheon Volt\n\nsource-7-copy:\nDesigned the all-new Volt ERP experience, retiring decades of legacy mainframe operations\n\nsource-40-copy:\nCase study\n\nsource-41-copy:\n400+ \n\nsource-42-copy:\nScreens estimated to complete the full ERP system\n\nsource-47-copy:\nHow We Helped\n\nsource-11-copy:\nEstablished a comprehensive MUI component system with documented interaction rules \nRapidly tested edge cases and alternate scenarios in a working prototype rather than static documentation\nBuilt an AI-assisted workflow, exporting Figma designs and using Claude to generate structured, reusable documentation for developer handoff\nReplaced inconsistent manual handoff processes with a living documentation system that scales as new components are added\n\nsource-17-copy:\n20+ \n\nsource-18-copy:\nScreens designed, establishing the reusable system\n\nsource-20-copy:\n1\n\nsource-21-copy:\nDocumented design system enabling that scale"
  - id: patterson-031
    content_kind: supplied_content
    template:
