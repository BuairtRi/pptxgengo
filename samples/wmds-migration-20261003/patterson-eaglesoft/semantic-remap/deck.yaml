        title: Tyler Giesting
        node01.photo: project:image68
        node02.text: Tyler
        node03.text: Managing Director · Healthcare M&A
        node04.label: Relevant perspective
        node04.body: Helps healthcare and private equity clients assess, plan and implement technology initiatives that advance growth.
        node05.label: Background
        node05.body: Former healthcare operator; 10+ years at West Monroe across payer, provider and healthcare IT sectors.
        node06.text: Selected experience
        node07.items.item01: Supported 400+ transactions
        node07.items.item02: EMR / practice-management platforms and multi-site services
        node07.items.item03: Technology diligence, roadmap execution and implementation
