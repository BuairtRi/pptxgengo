    brief: context/slide-026.md
    evidence_refs:
      - patterson-source
      - source-slide-026
    notes: "\n\nOriginal authored content retained for provenance:\nsource-4-copy:\nThe proposed fees and team structure will allow us to align on the required approach, while providing flexibility to adapt as the engagement evolves\n\nsource-5-copy:\nOur approach\n\nsource-7-copy:\nKEY NOTES\nScope Validation: Phase 1 is intended to validate the Traumasoft proposed implementation plan (including resourcing approach), operating-unit details that have been gathered already, contemplated rollout sequencing, to inform level of WM support required for subsequent phases\nOngoing Support: Phase 2 and 3 team composition and monthly fees will be confirmed at end of Phase 1 and may be adjusted over time based on rollout progress and PatientCare’s support needs (can be revisited at monthly project check-ins) \nExecution Assumptions: Fees assume timely participation from PatientCare and Traumasoft stakeholders and continuous execution; material delays, pauses, or changes in sequencing may affect timing, resource availability, and cost. Documentation of current state processes is out of scope (engagement assumes PatientCare will be able to provide most current state documentation required to help establish implementation timeline and Traumasoft discovery/planning phases)\nExpenses: Travel and other approved out-of-pocket expenses are excluded from professional fees and billed separately at cost\nThis is a draft Proposal for discussion only. Any final agreed to scope, fees and timing would be fully documented through a formal Statement of Work (SOW) and Professional Services Agreement (PSA)\n\nsource-9-copy:\nPhase 1: Initial 3-Week Sprint\n\nsource-10-copy:\nTIMING\n\nsource-11-copy:\n 1 Lead / PM, 2 Analysts & Quality Assurance\n\nsource-12-copy:\nRESOURCES\n\nsource-13-copy:\n$110,000 - $125,000\n\nsource-14-copy:\nFEES\n\nsource-20-copy:\nPhase 2: 3-6 months\nPhase 3: TBD – Monthly as needed\n\nsource-22-copy:\n1 Lead / PM, 1 Analyst, & Quality Assurance\n(Phase 2 support model to be validated in Phase 1)\n\nsource-24-copy:\n~$90,000 / month\n(Potential to reduce/adjust in phase 3)\n\ndraft-18-copy:\nUpdate\nWhat Patterson will receive, how success will be measured, assumptions, dependencies, and pricing structure."
