    brief: context/slide-034.md
    evidence_refs:
      - patterson-source
      - source-slide-034
    notes: "\n34\n\nOriginal authored content retained for provenance:\nsource-6-copy:\nDhaval Moogimane\nSenior Partner, High-Tech & Software\n\nsource-7-copy:\nBackground \nLeveraging decades of consulting experience, Dhaval specializes in helping software, technology, and IT services companies capitalize on emerging trends and drive growth. He has partnered with clients to create and grow new products, maximize value through M&A transactions, drive cross-functional initiatives, enable profitable growth through digital transformation, and transition to subscription-based business models. Dhaval energizes and aligns teams around growth opportunities and mentors junior consultants. Prior to joining West Monroe, he was a managing director at Waterstone Group. He holds degrees from Mumbai University and Indiana University.\nWhat makes Dhaval different\nA husband and father, Dhaval enjoys hiking, biking, and traveling. He has spent time in more than 25 countries and has lived and worked on three continents.\nWhere Dhaval makes an impact\nDhaval led the transformation of an enterprise software company’s operating model, tripling subscription revenue. He transformed a SaaS provider’s customer engagement model, increasing retention rates, and launched subscription offerings delivering over $200 million in value.\n\nsource-8-copy:\nIndustries served\nPrivate Equity\n\nsource-9-copy:\nSkills & Specialties\n25+ Ops and Strategy engagements with enterprise software providers \n$1 B Information Mgt Provider: Post sales operating model transformation\n$1.4B Workforce Mgmt. Software: SaaS Transformation\n$700M Higher Ed Software: Cloud offering launch and scale"
