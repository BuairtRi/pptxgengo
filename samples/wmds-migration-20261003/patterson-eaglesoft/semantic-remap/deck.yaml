    hidden: true
    notes: "Our Differentiators: \n- Easier technology due diligence in future transactions\n- Improved SOX readiness through:\nClear data lineage\nModern controls\nDocumented architecture\n- Platform extensibility:\nMulti-entity support\nFuture acquisitions\n- Reduced dependency on tribal knowledge\n\n37\n\nOriginal authored content retained for provenance:\nsource-16-copy:\nEaglesoft will eliminate critical business continuity concerns, preserve critical features, drive differentiation, and unlock future optionality for the enterprise.\n\nsource-10-copy:\nRESULTS YOU CAN COUNT ON\nFunctional parity with the VAX\nImproved SOX readiness through:\nClear data lineage\nModern controls\nDocumented architecture\nPlatform extensibility:\nMulti-entity support\nFuture acquisitions\nReduced dependency on tribal knowledge\n\nsource-7-copy:\nScalable, secure & maintainable enterprise architecture\n\nsource-9-copy:\nDATABASE\nAzure SQL\n\nsource-8-copy:\nBACK END\nNode.js\n\nsource-6-copy:\nFRONT END\nReact.js\n\nsource-20-copy:\nREPORTING\nPowerBI\n\nsource-21-copy:\nINTEGRATIONS\nSalesforce\n\nsource-53-copy:\nKEY FEATURE\n\nsource-55-copy:\nScalable integration framework for future expansions\n\nsource-56-copy:\nKEY FEATURE\n\nsource-57-copy:\nResponsive UI \noptimized for desktop users and capable of rendering on tablet and mobile devices\n\nsource-58-copy:\nKEY FEATURE\n\nsource-60-copy:\nModernized reporting\nand analytics\n\nsource-23-copy:\nKEY FEATURE\n\nsource-24-copy:\nSingle language (JavaScript) for Front and Back End development\n\nsource-80-copy:\nDEV\n\nsource-139-copy:\nENVIRONMENT SETUP\n\nsource-145-copy:\nQA\n\nsource-146-copy:\nTEST\n\nsource-147-copy:\nPROD\n\ndraft-11-copy:\nUpdate\nPhase Zero mobilization and baseline - First 30 days to validate the estate, existing performance suite, environments, datasets, priorities, telemetry, and acceptance measures."
