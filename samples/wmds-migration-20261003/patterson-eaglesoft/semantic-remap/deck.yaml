        node04.label: Relevant perspective
        node04.body: Helps software and technology companies build products, pursue growth and transition to subscription business models.
        node05.label: Background
        node05.body: Decades of consulting experience; formerly a Waterstone Group managing director. Mumbai University and Indiana University degrees.
        node06.text: Selected experience
        node07.items.item01: Tripled subscription revenue through an operating-model transformation
        node07.items.item02: Increased SaaS customer retention
        node07.items.item03: Launched subscription offerings delivering $200M+ in value
      keys:
        node07.items:
          - item-0
          - item-1
