    notes: "\n\nOriginal authored content retained for provenance:\nsource-6-copy:\nErik Brown\nSenior\nPartner, Product\nExperience and Engineering Lab\n\nsource-7-copy:\nBackground\nErik is a seasoned software engineer, entrepreneur, and leader who leverages innovative technology to drive business value. He led a $20 million technology roadmap project, enhancing a client’s risk modeling and cutting technology costs by over $10 million annually. As the executive technical lead for West Monroe’s AI Lab, he spearheaded the rollout of an internal AI chat platform and client-facing AI accelerators. Erik frequently speaks at industry events and hosts West Monroe’s “This is Digital” podcast. With extensive experience in software engineering, cloud computing, and AI, he leads the engineering team in PXEL practice. Erik holds a bachelor’s degree from the University\nof Illinois.\nWhat makes Erik different\nErik lives in Chicago with his family, enjoys music, and blends artistic expression with math and science through piano.\nWhere Erik makes an impact\nErik volunteers at St. Francis Xavier School, leading the Technology Committee; West Monroe designs their annual report.\n\nsource-8-copy:\nIndustries served\nHealthcare\nPrivate Equity\nCapital Markets\n\nsource-9-copy:\nSkills & Specialties\nMachine Learning / Artificial Intelligence \nAmazon Web Services \nMicrosoft Windows Azure \nEnterprise messaging and distributed architecture \nJava/JEE, Microsoft .NET & Python"
