    values:
      source-5-copy: |-
        Challenge
        Customized legacy product; rising maintenance costs and failed multi-year modernization attempts.
        Approach
        Intellio Evolve source analysis and a Java / Spring prototype with Claude Code and AWS Kiro.
        Domain design, technical specifications and architecture steering files guide implementation.
      source-6-copy: Legacy 4GL case evidence · results-led alternative
      source-7-copy: Agentic modernization accelerated discovery and delivery
      source-18-copy: Case study
      source-21-copy: 6+
      source-22-copy: months condensed into weeks
      source-23-copy: Intellio-assisted planning condensed months of rebuild strategy into days.
      source-25-copy: |-
        A big thank you to you and the West Monroe team. We highly appreciate the partnership and all that WM has contributed to our current success. It would not have been possible without the team's work.
        —Client CEO
      source-27-copy: ~10X
      source-29-copy: ~200K-LoC module transformed in one sprint; source describes traditional delivery as taking 10 times longer.
      source-12-copy: Source reports ~10x architecture-team productivity and a granular build plan through shared architectural insight.
      source-13-copy: Repeatable agentic workflow, refined with client leadership.
      source-20-copy: |-
        architecture-team
        productivity
    brief: context/slide-029.md
    evidence_refs:
      - patterson-source
      - source-slide-029
    notes: "Changed Aligned and excited architecture team by creating a holistic view of the architecture and dependencies\n to Aligned and energized the architecture team by establishing a clear, end-to-end view of the architecture and its dependencies.\n29\n\nOriginal authored content retained for provenance:\nsource-5-copy:\nOur client’s core product is built on legacy technologies and has been customized over time, increasing maintenance costs while losing market share and delaying innovation. Previous modernization efforts have taken multiple years and have failed due to the complexity of 4GL code transformation and migration strategies.\nHow we helped\nUsed an AI-first approach to evaluate the codebase and plan the strategic rewrite of one of the core modules \nUtilized Intellio Evolve alongside commercial AI tooling (Claude Code, AWS Kiro) to build a rapid prototype of a full rewrite to a modern language (Java / Spring) in a fraction of the time it would have taken with traditional approaches\nBest outcomes were driven by our approach using domain-driven design, technical specs, architecture steering files to guide AI agents with implementation\n\nsource-6-copy:\nBuilding Smarter Solutions to Modernize Legacy Code with AI\n\nsource-7-copy:\nAccelerated understanding, planning, and refactoring efforts of a legacy platform\n\nsource-18-copy:\nCase study\n\nsource-21-copy:\n6+\n\nsource-22-copy:\nmonths condensed into weeks\n\nsource-23-copy:\nPlanning the rebuild strategy was complex and the team couldn’t agree on a starting point. Using our agentic modernization approach supported by Intellio Evolve, we condensed an activity that had taken months into days\n\nsource-25-copy:\nA big thank you to you and the West Monroe team. We highly appreciate the partnership and all that WM has contributed to our current success. It would not have been possible without the team's work.\n—Client CEO\n\nsource-27-copy:\n10X\n\nsource-29-copy:\nOne of the platforms modules (~200K LoC) was targeted for transformation and performed inside a single sprint, an activity that would have taken 10 times longer using traditional approaches\n\nsource-12-copy:\nDrove ~10x improvement in architecture team productivity by creating a shared, end-to-end view of the architecture and dependencies—reducing discovery time and rework so the team could deliver more with less.\nProduced a highly granular build plan that would serve as the foundation for next-gen code generation\n\nsource-13-copy:\nCreated a repeatable, agentic workflow to serve as the go-forward development process\nEnabled ongoing refinement with the leadership team to fine-tune the build based on their domain expertise\n\nsource-20-copy:\nproductivity\nincrease"
