slides:
  - id: patterson-003
    content_kind: supplied_content
    template:
      scope: shared
      id: text/two-column
    values:
      slots:
        eyebrow: OUR UNDERSTANDING · ALTERNATIVE
        title: Clarify the estate and intended outcomes
        node01.label: What we heard
        node01.title: The current estate
        node02.text: PowerBuilder desktop dental platform; direct SQL Anywhere access; business rules dispersed across UI, application code, queries and stored procedures. A PostgreSQL environment already exists.
        node03.text: The architectural need is a reusable service and API foundation that supports desktop modernization and future options.
        node04.label: Desired outcomes
        node04.title: The intended platform
        node05.text: Decouple UI logic from governed data access. Modernize priority workflows and selected UI experiences. Prove full-stack performance with automation, telemetry and release gates.
        node06.text: Preserve current reliability while building a maintainable platform with future browser or cloud options.
      keys: {}
    brief: context/slide-003.md
    evidence_refs:
      - patterson-source
      - source-slide-003
    notes: "\n3\n\nOriginal authored content retained for provenance:\nsource-8-copy:\nOUR UNDERSTANDING\nPatterson is seeking to modernize Eaglesoft by creating a reusable data and API layer, upgrading selected PowerBuilder and UI workflows, and building automated performance testing to ensure the product remains reliable\n\nsource-20-copy:\nWhat We Heard\nEaglesoft is a desktop dental practice management platform built mainly on PowerBuilder\nPowerBuilder code still accesses SQL Anywhere directly through embedded SQL, DataWindows, dynamic SQL, and transaction logic\nRules are distributed across the UI, application code, database queries and stored procedures, making change and testing difficult\nA working PostgreSQL environment already exists, so the primary need is architectural decoupling and modernization\nThe platform needs a reusable service and API foundation that supports current desktop modernization while preserving options for future browser or SaaS development\n\nsource-22-copy:\nDesired Outcomes\nEstablish a reusable service and data layer that modernizes the UI and implements a 3-tier architecture to decouple UI logic from direct data access without destabilizing the current product\nInitiate an incremental modernization of priority workflows and selected UI experiences \nBuild automated full-stack performance testing, telemetry, and release gates to validate performance across the desktop, APIs, services, database, and infrastructure \nDevelop a maintainable platform with a path toward future browser or cloud capabilities"
  - id: patterson-011
    content_kind: supplied_content
    template:
      scope: local
      id: patterson-layout-011
    values:
      source-2-copy: TRANSITION ARCHITECTURE
      source-3-copy: Compare routes around a shared React and API foundation
      source-4-copy: Three transition options; browser/PWA is the preferred bounded-journey pilot hypothesis. Phase 0 validates the route.
      source-7-copy: PRACTICE NETWORK
      source-16-copy: Embedded PowerBuilder web view
      source-17-copy: Retain the desktop shell when runtime compatibility and adoption value justify embedded delivery.
      source-48-copy: CURRENT PILOT HYPOTHESIS
      source-50-copy: Browser application or PWA
      source-51-copy: Practice-network URL, without workstation installation; pilot journeys with limited native device needs.
      source-66-copy: Installed desktop companion
      source-67-copy: Electron, Tauri or .NET WebView2 may support printing and tighter device access, with an additional workstation install.
      source-76-copy: PHASE 0 VALIDATION
      source-77-copy: Validate runtime, identity, printing, imaging, devices, deployment, recovery and user effort.
      source-78-copy: 'Pilot hypothesis: browser / PWA'
      source-82-copy: Recommended modern web application
      source-86-copy: React + TypeScript is the recommendation
      source-87-copy: Assess Vue, Svelte, Angular or Blazor/.NET if alternatives to React are desirable.
      source-91-copy: Eaglesoft API layer
      source-92-copy: Domain operations, authorization, and transaction control
      source-96-copy: Segregated data ecosystem
