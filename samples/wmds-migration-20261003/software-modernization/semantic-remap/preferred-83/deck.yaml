      "exhibit1.photo": "software-media-image101"
      "approach.label": "WHAT WE DID"
      "approach.body": "Use 35+ interviews to guide experience and platform design.\nMobilize an 18-person team on Azure and AI foundations.\nPlan future GenAI and predictive capabilities; these are not realized outcomes."
      "proof.text": "RESULTS / SCOPE"
      "metric0.value": "65%"
      "metric0.label": "Report time reduction"
      "metric1.value": "+$30K"
      "metric1.label": "Average client savings from time saved"
    "notes": "\n\nOutsolve\n\n67\n\nORIGINAL SOURCE — COMPLETE VISIBLE COPY\n\n \n\n© 2026 West Monroe Partners  |  Reproduction and/or distribution without West Monroe Partners’ prior consent is prohibited.\n\n67\n\nCLIENT STORIES\n\n\n\n65%\n\nTime Savings for Consultants\n\nReduction in total report generation duration, saving consultants time\n\n+$30K\n\nAvg. Savings per Customer\n\nBased on the time savings gained through the changes our team implemented \n\nClient is a leading provider of affirmative action and compliance solutions which are backed by the advanced capabilities of a proprietary plan management platform. The legacy on-premise platform requires a technical redesign and modernization to address lengthy report processing time, limited integration with third-party systems (e.g., CRM, HRIS, etc.), duplicative functionality and complex user workflows, and security vulnerabilities arising from local desktop database calls.\n\nHR COMPLIANCE Software Provider\n\n\n\n\n\nHow can we prepare for future acquisitive growth and expansion of our enterprise customer base?\n\n\tModernization Strategy & Build\n\n\t\tConducted 35+ interviews with internal users to document existing functionality & pain points\n\n\t\tAssembled an 18-member agile product development team to design and implement the next generation plan management system to accelerate client’s time-to-market\n\n\t\tDeveloped a roadmap to reduce existing technical debt by rewriting legacy systems using modern, cloud-based technologies (i.e., Microsoft Azure, OpenAI, etc.), including architecture to support future GenAI and Predictive Analytics use case implementation (i.e., predicting billing, cross-sell/upsell, RevOps)\n\n\t\tDesigned and built a new platform that will simplify the plan management process, leverage AI/ML to automate highly manual tasks, and provide the foundation for future growth, using modern cloud infrastructure to automate current processes, enable high availability, and drive faster report processing\n\n\t\tOptimized platform costs by leveraging cloud-native technologies (e.g., data storage, analytics, etc.) that only incur costs when in use without impacting application scalability \n\n\t\t\n\nOriginal source SHA256: c732e693a6370a0abdf3b54f34ff456304a4a25025303c508a48559f1bee73e6"
