    values:
      slots:
        eyebrow: MODERNIZATION ECONOMICS
        title: The script has flipped on application modernization
        node01.text: AI reduces time and cost across analysis, design, build, testing and transition.
        node02.text: How are legacy systems holding your business back?
        node03.text: If modernization cost one-tenth of what you expect, what could that unlock?
        node04.label: AI-NATIVE READINESS
        node04.title: How could you become AI-native?
        node05.label: GROWTH VELOCITY
        node05.title: Where do release delays limit growth?
        node06.label: COST EFFICIENCY
        node06.title: Where could fewer handoffs cut cost?
        node07.label: CUSTOMER MOAT
        node07.title: How could connected journeys deepen loyalty?
    notes: |-
      SPEAKER BEATS

      The historical choice often looked poor in every direction: continue carrying legacy risk, reorganize the business around a packaged platform, or accept a large custom rebuild.

      Paint a future the business wants. Modernization can unify an acquired platform, unlock a market, redesign a consequential process, or create the foundation for agent-enabled work.

      “One-tenth of what you expect” is a conditional thought experiment. It invites the audience to reconsider deferred opportunities; it is not a claim that every program now costs one-tenth as much.

      The strategic claim is expanded choice. Business-fit modernization can deserve consideration more often.

      TRANSITION

      The first consequence of changed economics is strategic choice. The business no longer has to assume that its only practical future is to preserve legacy systems or conform to a broad packaged platform.

      EVIDENCE / GUARDRAIL

      Treat “the script has flipped” as the campaign thesis. Slide 1A explains the strategic implication, and slide 2 shows the workstreams and cases behind it. Do not attach a universal percentage or claim that every modernization is now inexpensive.

      ORIGINAL SOURCE — COMPLETE VISIBLE COPY









      © 2026 West Monroe Partners | Reproduction and/or distribution without West Monroe Partners’ prior consent is prohibited.

      3

      MODERNIZATION ECONOMICS

      The script has flipped on application modernization

      AI is significantly reducing the time and cost of complex modernization by changing how teams analyze, design, build, test, and transition systems.

      How are your legacy systems holding your business back?

      If modernizing your legacy software cost one-tenth of what you expect, what would that unlock for your business?

      AI-NATIVE READINESS

      How can you make your business ready to become an AI-native enterprise?

      GROWTH VELOCITY

      What products could you launch—or which markets could you enter—without legacy release-cycle delays?

      CUSTOMER MOAT

      How could you strengthen your customer moat by giving them a more integrated experience?

      COST EFFICIENCY

      Where would streamlined integrations and fewer handoffs unlock efficiencies across your business?

