  - "id": "software-source-059"
    "content_kind": "supplied_content"
    "template":
      "scope": "local"
      "id": "case-source-059-quote-outcome"
    "brief": "context/software-source-059.md"
    "values":
      "eyebrow": "HEALTHCARE PROFESSIONAL ASSOCIATION"
      "title": "Create a roadmap beyond a 20-year-old COBOL core"
      "source": "Source: supplied West Monroe case study."
      "metric0.value": "54"
      "metric0.label": "Business capabilities elaborated"
      "metric1.value": "250"
      "metric1.label": "Business processes supported"
      "metric2.value": "45"
      "metric2.label": "Applications on roadmap"
      "challenge.label": "CHALLENGE"
      "challenge.body": "The core application constrained innovation, customer experience and system reliability."
      "approach.label": "WHAT WE DID"
      "approach.body": "Define capabilities, reference architecture and a tactical roadmap.\nCombine human-centered research with technology and change planning.\nEstablish governance and train teams in Agile, HCD and DevOps."
      "quote.text": "We have been very happy with the services we get from WMP, most importantly the thought leadership we get from your on-site team."
      "quote.by": "Chief Information Officer"
    "notes": "\n\nCAP SCORES Strategy\n\n59\n\nORIGINAL SOURCE — COMPLETE VISIBLE COPY\n\n© 2026 West Monroe Partners | Reproduction and/or distribution without West Monroe Partners’ prior consent is prohibited.\n\n36\n\nCLIENT STORIES\n\n\n\nWe have been very happy with the services we get from WMP, most importantly the thought leadership we get from your on-site team.\n— Chief Information Officer\n\n\n\n54\n\nBusiness Capabilities Elaborated\n\nWe discovered and documented business capabilities around which future services would be created, supporting 250 business processes\n\n\n\n45\n\nRelated Apps to be Modernized\n\nWe defined the modernization roadmap and initial disposition approaches for 45 related applications\n\nClient’s 20-year-old custom COBOL application is the “beating heart” of business operations, but the aging system and associated technologies have increasingly unpredictable negative impacts on customer/user experience and hamper ability to enhance digital experience. This solution prevented the client from developing new innovations due to complexity and technical debt. West Monroe was engaged to translate strategic objectives into an architecture and modernization roadmap to target cloud-based technologies and a microservices platform.\n\nHealthcare Professional Association\n\n\n\nHow can we address aging tech, monolithic apps, and our waterfall methodology so we can \ninnovate faster?\n\n\tModernization Strategy & Build\n\n\t\tTook a holistic approach to technology strategy and planning that incorporated program management, organizational change management, and human-centered design (HCD) alongside core technology disciplines\n\n\t\tDeveloped architecture and guiding principles to address strategic goals, such as increased customer & member engagement as well as improved system performance and availability\n\n\t\tEducated client team on HCD and developed customer research plan to gather feedback for more impactful requirements and prioritization of roadmap initiative\n\n\t\tPartnered with Client to define governance structures that would allow them to train their team on Agile methodologies without compromising their ability to deliver\n\n\t\tDelivered a tactical roadmap to begin a digital transformation and develop a microservice architecture platform\n\n\t\tEducated client resources on concepts critical to program success such as Agile scrum, HCD, and DevOps \n\n\t\tDelivered reference architecture to guide teams through the design and build of microservices, data platform, and sunsetting monolithic applications\n\n\t\t\n\nOriginal source SHA256: c732e693a6370a0abdf3b54f34ff456304a4a25025303c508a48559f1bee73e6"
