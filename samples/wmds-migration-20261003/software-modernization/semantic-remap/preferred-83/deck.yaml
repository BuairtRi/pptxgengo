    values:
      eyebrow: SOFTWARE MODERNIZATION
      title: AI changes modernization—but organizations must change the approach
      node01.text: Most organizations do not yet know how to capture AI's value across the modernization lifecycle.
      node02.title: Legacy holds the business back
      node02.icon.name: risk-alert-arrow
      node02.body.item01.p: Expensive, vulnerable environments slow innovation, time-to-market and developer productivity.
      node03.title: Lift-and-shift repeats the past
      node03.icon.name: process-gear
      node03.body.item01.p: Replicating existing systems misses the chance to reimagine work for AI and create future value.
      node04.label: AI changes the opportunity
      node04.body.item01.p: Use AI across analysis, design, build, test and transition.
      node05.label: SOURCE CLAIM — VALIDATE BEFORE REUSE
      node05.metric.value: 60–75%
      node05.metric.label: of efforts exceed budget or time, are scaled back, or deliver less value than promised.
    notes: "\n\n47% of respondents to Gartner’s latest CIO and Technology Executive Survey selected “integrate, innovate, and modernize enterprise applications” as a focus for the next year, the third highest priority overall1 \n\nMonolithic systems reduce time-to-market for new features. CTOs and engineering leaders struggle to adapt, grow, and scale when constrained by legacy tech, straining ability to capture new market opportunities.\n\nSoftware portfolios can sprawl, and many are riddled with technical debt with 20-40% of technology value locked up in that debt2. CIOs and IT leaders want to rationalize and reduce the sprawl and keep debt in check.\n\nSecurity testing leader Black Duck found 84% of codebases contained vulnerabilities, and 49% included components with no activity for 2 years3. CISOs want to modernize to drive more secure software supply chains.\n\n\n\n\n\n1 Use Continuous Modernization to Optimize Legacy Applications. Gartner. 10 January 2024\n2 Tech Debt: Reclaiming Tech Equity. McKinsey. 2020\n3 Open Source Security and Risk Analysis. Black Duck. 2024\n\n\n\n15\n\nORIGINAL SOURCE — COMPLETE VISIBLE COPY\n\n\n\n© 2026 West Monroe Partners | Reproduction and/or distribution without West Monroe Partners’ prior consent is prohibited.\n\n15\n\nSOFTWARE MODERNIZATION\n\nWith constant AI innovations, software modernization is faster, easier, cheaper, and more necessary than ever before. \n\nBut most organizations don’t understand how to capitalize on AI’s value in the modernization lifecycle.\n\nLegacy Systems Are \nHolding the Business Back\n\nLegacy architecture and environments are expensive to maintain, increasingly vulnerable, slowing innovation and time-to-market, and a drag on developer productivity.\n\n\n\nMOST MODERNIZATIONS FAIL\n\n60-75%\n\nof software modernization efforts go over budget or exceed timeline, are partially abandoned or scaled back, and/or deliver less business value than promised.\n\nMost Orgs Don’t Know How to Optimize What They Have\n\nThe majority of modernization efforts become “lift-and-shift” exercises that replicate the past instead of reimaging systems for AI and rearchitecting them to create future value. \n\n\n\nMOST MODERNIZATIONS FAIL\n\n60-75%\n\nof software modernization efforts go over budget or exceed timeline, are partially abandoned or scaled back, and/or deliver less business value than promised.\n\nOriginal source SHA256: c732e693a6370a0abdf3b54f34ff456304a4a25025303c508a48559f1bee73e6"
