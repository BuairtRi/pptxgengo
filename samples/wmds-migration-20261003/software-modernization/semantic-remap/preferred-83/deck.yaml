      "eyebrow": "INSURANCE MANAGEMENT SOFTWARE"
      "title": "Reduce agent effort and improve renewal performance"
      "source": "Source: supplied West Monroe case study."
      "challenge.label": "CHALLENGE"
      "challenge.body": "Agents needed to offload data entry and give customers a clearer service experience."
      "exhibit0.photo": "software-media-image96"
      "exhibit1.photo": "software-media-image98"
      "exhibit2.photo": "software-media-image99"
      "approach.label": "WHAT WE DID"
      "approach.body": "Research personas and map customer journeys.\nPrototype improved workflows across web and native apps.\nShift data entry to customers to free agent time."
      "proof.text": "RESULTS / SCOPE"
      "metric0.value": "68%"
      "metric0.label": "Agent time savings"
      "metric1.value": "+5%"
      "metric1.label": "Renewals"
    "notes": "\n\nVertafore\n\n66\n\nORIGINAL SOURCE — COMPLETE VISIBLE COPY\n\n\n\n© 2026 West Monroe Partners  |  Reproduction and/or distribution without West Monroe Partners’ prior consent is prohibited.\n\n66\n\nCLIENT STORIES\n\n\n\n68%\n\nTime Savings for Agents\n\n+5%\n\n\n\nIncreased Renewals\n\n\n\n\n\n\n\nClient's end user insurance agents were becoming data entry specialists, uploading documents and data required to provision insurance policies. This was slowing down the time to close or renew policies. Further, the existing product suite failed to engage users, lacking a modern mobile experience that allowed users to easily find content. \n\nInsurance Management Software Provider\n\n\n\n\n\nHow can we modernize our codebase and experience to engage our users in a different way? How can insurance agents close/renew policies more quickly?\n\n\tModernization Strategy & Build\n\n\t\tConducted persona identification, product discovery, user journey mapping, and prototyping to evaluate and test approaches for simplifying agent interaction, ultimately finding that offloading data entry to customers was preferred and saved agent time\n\n\t\tModernized client's software by prioritizing key features, streamlining workflows, and integrating advanced technologies, resulting in enhanced performance, user experience, and significant improvements in operational capabilities and customer satisfaction\n\n\t\tAssembled a multi-disciplinary team to build both web and native mobile applications, supporting modern agent/customer interaction and driving efficiency and innovation.\n\n\t\t\n\nOriginal source SHA256: c732e693a6370a0abdf3b54f34ff456304a4a25025303c508a48559f1bee73e6"
