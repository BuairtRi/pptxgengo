      node03.text: |-
        Prioritize applications, costs and roadmaps; assess value, health, risks and architecture. Interview owners, define dispositions, identify targets and sequence modernization. For priority apps, define target architecture and interim phases to de-risk the business case.

        OUTPUTS — Candidate assessment, application dispositions, modernization roadmap and conceptual architecture.
      node04.label: OR HERE — 2-WEEK SPRINTS
      node04.title: Execution & sustainment
      node05.text: |-
        Define backlog; iteratively design, build and test with GenAI. Facilitate UAT and controlled releases, using legacy–modern coexistence where needed. Transfer codebase, toolchain and operating knowledge to the client through coaching and an Enablement Playbook.

        OUTPUTS — Iterative modernized releases, Enablement Playbook, continuous modernization and DevSecOps capability. Duration depends on scope.
      logo: source20-intellio-logo
      footer: 'Evolve carries context across Rationalize, Modernize and Sustain: inventory and dependencies → reports, target direction and waves → validated agent-ready context and acceptance criteria.'
    notes: "\n\n\n\n20\n\nORIGINAL SOURCE — COMPLETE VISIBLE COPY\n\n\tModernization Execution & Sustainment\tTimeline: 2-Week Sprints \n\t(duration depends on scope)\n\n\n\n\n\n\tRationalization & Modernization Strategy\tTimeline:\n\n\t\t~4-8 Weeks\n\n  \n\n\n\n\n\n© 2026 West Monroe Partners | Reproduction and/or distribution without West Monroe Partners’ prior consent is prohibited.\n\n20\n\nBased on your current progress, we can rationalize applications and define the modernization strategy or get started directly with execution.\n\nSOFTWARE MODERNIZATION\n\nSTART HERE…\n\n\n\n\n\n…OR HERE\n\n\n\n\n\n\n\n\n\nOBJECTIVES\n\nPrioritize application list and understand costs, roadmaps, and planned changes\n\nDetermine initial understanding of business value, technical health, and risks per application, and the enterprise architectural strategy\n\nInterview application owners, evaluate app technologies for pain points and risks, create and socialize initial dispositions\n\nPrioritize key modernization targets and document modernization roadmap\n\nFor priority apps, define future-state architecture with interim phases as necessary, contributing to product business case and plans that de-risk business impact.\n\nOUTPUTS\n\nApp Disposition, Modernization Roadmap, Conceptual Architecture\n\nModernization Candidate Assessment\n\nApplication Dispositions\n\nModernization Strategy\n\nOBJECTIVES\n\nFor priority applications to be modernized, document backlog of requirements\n\nPlan and execute iterative design & build sprints accelerated by GenAI to upgrade/rebuild features using the modern tech stack\n\nConduct QA and facilitate UAT of the modernized software\n\nConduct releases of the modernized application per release plan, prioritizing side-by-side releases of the legacy and modern experiences where needed\n\nContinuously transfer knowledge to client team about the new codebase and supporting tools/processes; document in Enablement Playbook.\n\nOUTPUTS\n\nIterative releases of modernized software, Developer Enablement Playbook\n\nMonolithic Application Decomposition\n\nIterative Modernization Sprints\n\nRelease Management & Experience\n\n\n\nContinuous Modernization\n\nDevSecOps Enablement\n\nEnable Next Gen Product Roadmaps\n\n\n\nScan the codebase and generate system-wide structural and semantic understanding\n\nSystem Inventory, Dependency Mapping, Business Semantics\n\n\n\nConvert evidence into modernization reports, target-state direction, and execution planning.\n\nFirst-Pass Report, North Star HLD, \nWave Planning\n\nCarry forward validated context, guardrails, and acceptance criteria into implementation.\n\n\nAgent-Ready Context, Validation Criteria, Tool Integration\n\n\n\n\n\n03   Sustain\n\n02   Modernize\n\n01   Rationalize\n\nOriginal source SHA256: c732e693a6370a0abdf3b54f34ff456304a4a25025303c508a48559f1bee73e6"
