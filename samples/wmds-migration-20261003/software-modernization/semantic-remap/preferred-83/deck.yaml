    "brief": "context/software-source-056.md"
    "values":
      "eyebrow": "LARGE EAST COAST UTILITY"
      "title": "Reduce security risk across a data staging platform"
      "source": "Source: supplied West Monroe case study."
      "challenge.label": "CHALLENGE"
      "challenge.body": "AngularJS end of life and unsupported dependencies exposed the UI, API and data layers."
      "action0.label": "PLAN"
      "action0.body": "Upgrade .NET and PostgreSQL; refactor and test APIs."
      "action1.label": "BUILD"
      "action1.body": "Rewrite the UI in Angular through iterative client reviews."
      "action2.label": "TRANSITION"
      "action2.body": "Complete UAT, knowledge transfer, security checks and production release."
      "proof.text": "RESULTS / SCOPE"
      "metric0.value": "57"
      "metric0.label": "Features identified to prioritize"
    "notes": "\n\nCon Edison EDAP Modernization\n\n\n\n56\n\nORIGINAL SOURCE — COMPLETE VISIBLE COPY\n\n\n\n© 2026 West Monroe Partners | Reproduction and/or distribution without West Monroe Partners’ prior consent is prohibited.\n\n33\n\nClient identified the need for the data staging platform to be upgraded with modern and supportable technology given the end-of-life status of AngularJS, reducing technical debt and updating unsupported dependencies to modern supportable standards across the UI, API, and data layers.\n\nLARGE EAST COAST UTILITY \n\nHow do we avoid security risk and reduce technical debt?\n\n57\n\nApp Features Identified\n\nInitial modernization inventory included 57 application features to be prioritized for modernization\n\nCLIENT STORIES\n\n\tModernization Strategy & Build\n\n\t\tMobilized for the project to review existing application codebase, known issues, npgsql, and other dependencies; setup local development environments and source code repositories\n\n\t\tDetermined target .NET version for upgrade, migrated data from existing PostgreSQL instance to new one, and refactored API functionality based on data testing\n\n\t\tIteratively designed, built, and tested rewritten UI functionality in the new Angular code base, reviewing and deploying code for review with client along the way\n\n\t\tFacilitated client acceptance testing and knowledge transfer, prepared and validated Production deployment checklist, and supported client with production release planning including internal security compliance and code scanning activities\n\n\t\tDeployed new solution to PROD environment including Staging PostgreSQL migration to new instance, finalized client acceptance testing and retrospective\n\n\t\t\n\n\t\t\n\nOriginal source SHA256: c732e693a6370a0abdf3b54f34ff456304a4a25025303c508a48559f1bee73e6"
  - "id": "software-source-057"
    "content_kind": "supplied_content"
    "template":
      "scope": "local"
      "id": "case-source-057-exhibit-left"
    "brief": "context/software-source-057.md"
    "values":
      "eyebrow": "LARGE INVESTOR-OWNED UTILITY"
      "title": "Modernize solar workflows safely"
      "source": "Source: supplied West Monroe case study."
      "contextlabel.text": "CHALLENGE"
      "context.text": "A decade-old AngularJS application served six operating companies and slowed development."
      "metric0.value": "675K+"
      "metric0.label": "Lines of code migrated"
      "metric1.value": "800+"
      "metric1.label": "Files modified"
      "exhibit0.photo": "software-media-image83"
      "exhibit1.photo": "software-media-image80"
      "exhibit2.photo": "software-media-image81"
      "exhibit3.photo": "software-media-image82"
      "approach.label": "WHAT WE DID"
      "approach.body": "Select Angular for maintainability, theming and dynamic forms.\nInventory and rationalize pages; validate feature parity with business users.\nRun old and new UIs side by side in a production pilot."
    "notes": "\n\nExelon Intellio UI Modernization\n\n57\n\nORIGINAL SOURCE — COMPLETE VISIBLE COPY\n\n\n\n© 2026 West Monroe Partners | Reproduction and/or distribution without West Monroe Partners’ prior consent is prohibited.\n\n34\n\nCLIENT STORIES\n\n\n\nFrom this…\n\n…to this\n\nClient needed to modernize a decade-old solution that powers workflows for solar interconnection across their six operating companies. The application’s AngularJS front-end technology was nearing end-of-life and slowing down development team efficiency.\n\nLARGE INVESTOR-OWNED UTILITY\n\nHow can we accelerate innovation and increase security maturity on our solar interconnection solution?\n\n\tModernization Strategy & Build\n\n\t\tAssessed leading frameworks and recommended Angular based on key business priorities of maintainability, theming, and dynamic forms. Angular enhances maintainability with its opinionated defaults, facilitating quick project initiation and simplifying new developer onboarding. Additionally, Angular Material and Formly support dynamic theming and form generation, respectively, accelerating front-end development with robust components and JSON-based configurations.\n\n\t\tOur team inventoried all existing pages, rationalized which pages should carry over to the new Angular UI, re-wrote them leveraging an Agile development process, and engaged business stakeholders to validate feature parity prior to final cutover.\n\n\t\tConducted pilot phase where the old and new UIs were running side by side in production to enable a seamless transition for the business.\n\n\t\t\n\n\t\t\n\n675K+\n\n\n\nLines of code migrated\n\n800+\n\nFiles \nmodified\n\nOriginal source SHA256: c732e693a6370a0abdf3b54f34ff456304a4a25025303c508a48559f1bee73e6"
