        title: Operate, evolve and complete decommissioning
        node01.label: OPERATE AND EVOLVE
        node01.title: Improve the capability
        node02.text: Establish ownership, service levels, observability, security, cost management and a product backlog. AI assists triage, impact analysis and backlog development with governed context.
        node03.text: OUTPUT — Operating model, roadmap, measured service and business performance.
        node04.label: LIVING KNOWLEDGE
        node04.title: Preserve what matters
        node05.text: Keep process, rules, architecture, decisions, tests, runbooks and operating knowledge current. Reduce dependence on a few experts and give the next change a stronger starting point.
        node06.text: AI assists documentation and test maintenance; people govern the knowledge.
        node07.label: DECOMMISSION
        node07.title: Verify retirement
        node08.text: Find consumers and dependencies before removing old code, infrastructure, data paths, interfaces, jobs, licenses and support. Transfer business, control and operating knowledge that must survive.
        node09.text: OUTPUT — Verified retirement, closed controls, ended dual run and realized savings.
    notes: |-
      Sustainment turns a project into a product capability.

      Rich documented context prevents tribal knowledge from reappearing, lowers critical-person risk, and accelerates future change.

      Agentic maintenance may change long-term labor economics, but that requires measured pilots and defined controls.

      Transition: The cost case must include every phase, especially dual run, operation, and decommissioning.

