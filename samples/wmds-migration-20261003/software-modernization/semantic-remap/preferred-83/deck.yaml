    brief: context/software-source-081.md
    values:
      eyebrow: RATIONALIZATION & MODERNIZATION STRATEGY — ~4–8 WEEKS
      title: Connect application decisions to future business workflows
      rowheight: 50
      columns:
        - k: c
          label: Objective
          w: 228
        - k: h
          label: Work
          w: 348
        - k: m
          label: Decision-ready output
          w: 270
      rows:
        - c: Prioritize the portfolio
          h: 'Confirm apps, ownership, costs, roadmaps and planned change'
          m: Portfolio fact base
        - c: Assess value and risk
          h: 'Evaluate health, dependencies and architecture fit with owners'
          m: 'Business value, health and risk profiles'
        - c: Reconstruct the process
          h: 'Map workflows, handoffs, exceptions, pain and app touchpoints'
          m: Current-state workflow map
        - c: Define dispositions
          h: 'Create and socialize choices; identify modernization targets'
          m: Application disposition register
        - c: Reimagine future work
          h: 'Design business-fit workflows, architecture, interim states and waves'
          m: 'Workflow vision, roadmap and conceptual architecture'
      footer: 'Executive decision: approve strategy, refine scope or begin execution. Outputs carry into delivery as priorities, process vision and architecture guardrails.'
    notes: |-
      Working draft based on the Patterson Eaglesoft pursuit brief, the West Monroe modernization lifecycle working model, Intellio Evolve strategy material, and the user-provided AI-native PDLC working deck. The 4–8 week range and high-level 7R framing are planning assumptions, not commercial commitments.



      ORIGINAL SOURCE — COMPLETE VISIBLE COPY



      © 2026 West Monroe Partners | Reproduction and/or distribution without West Monroe Partners’ prior consent is prohibited

      4

















































































      RATIONALIZATION & MODERNIZATION STRATEGY

      Rationalization connects application decisions to reimagined business workflows, a modernization roadmap, and conceptual architecture

      A focused ~4–8 week effort reconstructs how work gets done today, reimagines the future-state workflow, and aligns application dispositions to value, health, risk, and enterprise architecture

      OBJECTIVES

      OUTPUTS





      01

      Prioritize the application portfolio

      Confirm in-scope applications and understand costs, roadmaps, ownership, and planned changes





      02

      Assess value, health, and risk

      Assess business value, technical health, risk, dependencies, and architecture fit through owner interviews and technology analysis





      03

      Reconstruct current-state business processes

      Map workflows, handoffs, pain points, exceptions, and application touchpoints with business and application owners





      04

      Define application dispositions

      Create and socialize initial dispositions; identify the applications best suited for modernization





      05

      Reimagine future-state business workflows

      Design workflows tailored to how the business operates, then translate them into modernization targets, architecture, interim states, and a sequenced roadmap



      Decision-ready rationalization outputs



      Portfolio fact base and current-state workflow map



      Business value, technical health, and risk profiles



      Application disposition register



      Reimagined workflow and modernization roadmap



      Conceptual future-state architecture



      EXECUTIVE DECISION

      Approve strategy  •  Refine scope  •  Begin execution



      Rationalization defines what to modernize and how the business should work in the future

      The outputs become the starting context, priorities, process vision, and guardrails for modernization execution

      Original source SHA256: c732e693a6370a0abdf3b54f34ff456304a4a25025303c508a48559f1bee73e6
