    "values":
      "eyebrow": "HULU · LIVE TV"
      "title": "Deliver Live TV on Apple platforms"
      "source": "Source: supplied West Monroe case study."
      "contextlabel.text": "CHALLENGE"
      "context.text": "Hulu needed to deliver Live TV on iOS and Apple TV with a modern application architecture."
      "metric0.value": "Millions"
      "metric0.label": "Apple TV users reached"
      "metric1.value": "Swift"
      "metric1.label": "Modernized iOS / tvOS application"
      "exhibit0.photo": "software-media-image95"
      "approach.label": "WHAT WE DID"
      "approach.body": "Move Objective-C code to Swift.\nUse reactive application state and automated CI feedback.\nCombine co-located and remote delivery in Santa Monica and Seattle."
    "notes": "\n\nHulu iOS\n\n\n\n63\n\nORIGINAL SOURCE — COMPLETE VISIBLE COPY\n\n© 2026 West Monroe Partners  |  Reproduction and/or distribution without West Monroe Partners’ prior consent is prohibited.\n\n63\n\nCLIENT STORIES\n\nHulu was approaching the launch of Hulu Live TV and sought out West Monroe to guide their development teams and ensure a timely launch for both their iOS app \nand Apple TV app. \n\nHulu\n\n\n\nNative iOS & \nApple TV Design & Build\n\n\tModernization Strategy & Build\n\n\t\tOur team co-located with the Hulu team in Santa Monica while working with their remote iOS team in Seattle. The two worked together to re-write their iOS app while building out their Apple TV app to support the launch of Hulu Live TV.\n\n\t\tAs part of the re-write, both apps were updated to use Swift instead of Objective-C. A reactive framework was introduced to better manage internal app state.\n\n\t\tA significant update was also made to the iOS and tvOS CI pipelines to provide a faster, automated feedback loop for integration tests.\n\n\t\tThe team successfully rolled out the app to millions of Apple TV users and was able to make quick and efficient updates.\n\n\t\t\n\nOriginal source SHA256: c732e693a6370a0abdf3b54f34ff456304a4a25025303c508a48559f1bee73e6"
