    "notes": "\n\nNASB Application Rationalization\n\n72\n\nORIGINAL SOURCE — COMPLETE VISIBLE COPY\n\n© 2026 West Monroe Partners  |  Reproduction and/or distribution without West Monroe Partners’ prior consent is prohibited.\n\n72\n\nCLIENT STORIES\n\n\n\n15%\n\nIdentified IT Cost Reductions\n\nIdentified redundant apps, unlocking $2.77M in savings (15% of tech spend), enabling Client to simplify its tech landscape\n\n\n\n6\n\nMid-tier Apps Retired\n\nRecommended RPA tools and self-service reporting to streamline workflows, resulting in retirement of 6 apps and $350K in yearly savings\n\nClient, a Community Bank in Kansas, faced shifts in their business model due to changes in the Financial Services Industry and interest rates. They engaged West Monroe to assess their technology landscape, identifying risks, scalability issues, and improvement opportunities. West Monroe also rationalized applications in Accounting and Compliance and developed a future state architecture and roadmap as part of the Innovation Strategy & Roadmap initiative.\n\nCommunity bank\n\n\n\n\n\nHow can we better position our technology for sustainability and efficiency? \n\n\tModernization Strategy & Build\n\n\t\tEstablished a maturity framework to assess the client's current state across digital capabilities including governance, strategy, SDLC, data engineering, security, and infrastructure\n\n\t\tConducted a comprehensive review of the Bank's technology landscape, including in-depth interviews with key stakeholders to understand application relevance to business operations\n\n\t\tPerformed an IT spend and resource benchmark and identified recommendations to address risks, scalability issues, and gaps in the technology portfolio, processes, and organization\n\n\t\tDeveloped a roadmap with key dependencies, milestones, and high-level cost estimates, along with future state solution architecture for Accounting and Compliance processes\n\n\t\tRecommended initiatives that Increase focus on data & analytics capabilities to enable business users to efficiently access data to enable data-driven decision making, enhance IT governance and organization structure through implementing formal processes, and create and deploy technology solutions based on consistent guiding principles and architecture patterns\n\n\t\tProvided advisory support for the Tech Steering Committee throughout the project duration\n\nOriginal source SHA256: c732e693a6370a0abdf3b54f34ff456304a4a25025303c508a48559f1bee73e6"
