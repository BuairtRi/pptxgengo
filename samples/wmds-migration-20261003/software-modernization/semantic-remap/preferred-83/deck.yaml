      eyebrow: SECURITY TRIAGE — PILOT OR SCAFFOLD
      title: From scan findings to a reviewable remediation plan
      rowheight: 50
      columns:
        - k: c
          label: Step
          w: 228
        - k: h
          label: Evidence and assistance
          w: 348
        - k: m
          label: Reviewable output
          w: 270
      rows:
        - c: '01 Normalize inventory'
          h: 'Organize CVEs, components, severity, scanner evidence and missing information'
          m: Structured findings inventory
        - c: '02 Connect to the system'
          h: 'Map issues to source, dependencies, code paths, integrations and potential blast radius'
          m: Source-linked affected areas
        - c: '03 Review applicability'
          h: 'Flag duplication, uncertain reachability, controls and false-positive questions'
          m: Questions for security specialists
        - c: '04 Prioritize remediation'
          h: 'Consider severity, criticality, exposure, dependencies, operational risk and delay'
          m: Evidence-based candidate priorities
        - c: '05 Prepare the plan'
          h: 'Package evidence, actions, sequence, validation tests, estimation questions and owners'
          m: Plan for specialist confirmation
      footer: 'PILOT: structured CVE inputs and triage artifacts exist; default production runner unavailable. Specialists confirm applicability, exploitability, remediation, testing and risk acceptance.'
    notes: |-
      The value hypothesis is contextual triage.

      Do not claim that Evolve automatically proves false positives, establishes exploitability, or generates production-ready remediation.

      The same pattern can support diligence, technical-debt planning, post-close remediation, or a security-led catalyst.

      Transition: The source-backed context built during Rationalize can continue creating value during Build and Sustain.

      ORIGINAL SOURCE — COMPLETE VISIBLE COPY

      From security scan findings to a reviewable remediation plan



      INPUTS

      Structured CVE or scanner findings  •  relevant source repository and Evolve evidence store  •  component, dependency, integration, and business-criticality context





      01

      NORMALIZE THE INVENTORY

      Organize findings, affected packages or components, severity, scanner evidence, and missing information.





      02

      CONNECT FINDINGS TO THE SYSTEM

      Map candidate issues to source-linked components, dependencies, code paths, integrations, and potential blast radius where evidence supports it.





      03

      REVIEW APPLICABILITY

      Flag supporting evidence, possible duplication, uncertain reachability, compensating controls, and false-positive questions for a security specialist.





      04

      PRIORITIZE REMEDIATION

      Consider severity with business criticality, exposure, dependencies, operational risk, and cost of delay.





      05

      PREPARE THE PLAN

      Produce a reviewable package with evidence links, affected areas, candidate actions, sequencing, validation tests, estimation questions, and owners.



      HUMAN CONTROL

      Security and engineering specialists confirm applicability, exploitability, remediation, testing, and risk acceptance.



      PILOT OR SCAFFOLD

      The audited product accepts structured CVE inputs and includes a triage handler and artifact outputs, but the default production runner is unavailable. Position as a pilot until the product owner confirms a production-ready execution path and evidence from real use.

