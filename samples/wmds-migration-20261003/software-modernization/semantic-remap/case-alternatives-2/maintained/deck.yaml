slides:
  - id: software-source-056
    content_kind: supplied_content
    template:
      scope: local
      id: case-alt-source-056-what-we-did
    brief: context/software-source-056.md
    values:
      eyebrow: LARGE EAST COAST UTILITY
      title: Reduce security risk across a data staging platform
      source: 'Source: supplied West Monroe case study.'
      challenge.label: CHALLENGE
      challenge.body: AngularJS end of life and unsupported dependencies exposed the UI, API and data layers.
      action0.label: FOUNDATION
      action0.body: Review code and dependencies; choose .NET, migrate PostgreSQL and refactor/test APIs.
      action1.label: UI REBUILD
      action1.body: Iteratively build and test the Angular UI with client reviews.
      action2.label: PRODUCTION TRANSITION
      action2.body: UAT, knowledge transfer, security checks and production deployment.
      proof.text: APPLICATION FEATURES
      metric0.value: "57"
      output0.label: SUPPORTABLE STACK
      output0.body: Updated .NET/PostgreSQL and tested APIs.
      output1.label: REWRITTEN UI
      output1.body: Reviewed Angular functionality.
      output2.label: RELEASE READINESS
      output2.body: Production deployment, acceptance testing and retrospective.
      scope.text: 'Initial modernization inventory: features to prioritize for modernization.'
    notes: "\n\nCon Edison EDAP Modernization\n\n\n\n56\n\nORIGINAL SOURCE — COMPLETE VISIBLE COPY\n\n\n\n© 2026 West Monroe Partners | Reproduction and/or distribution without West Monroe Partners’ prior consent is prohibited.\n\n33\n\nClient identified the need for the data staging platform to be upgraded with modern and supportable technology given the end-of-life status of AngularJS, reducing technical debt and updating unsupported dependencies to modern supportable standards across the UI, API, and data layers.\n\nLARGE EAST COAST UTILITY \n\nHow do we avoid security risk and reduce technical debt?\n\n57\n\nApp Features Identified\n\nInitial modernization inventory included 57 application features to be prioritized for modernization\n\nCLIENT STORIES\n\n\tModernization Strategy & Build\n\n\t\tMobilized for the project to review existing application codebase, known issues, npgsql, and other dependencies; setup local development environments and source code repositories\n\n\t\tDetermined target .NET version for upgrade, migrated data from existing PostgreSQL instance to new one, and refactored API functionality based on data testing\n\n\t\tIteratively designed, built, and tested rewritten UI functionality in the new Angular code base, reviewing and deploying code for review with client along the way\n\n\t\tFacilitated client acceptance testing and knowledge transfer, prepared and validated Production deployment checklist, and supported client with production release planning including internal security compliance and code scanning activities\n\n\t\tDeployed new solution to PROD environment including Staging PostgreSQL migration to new instance, finalized client acceptance testing and retrospective\n\n\t\t\n\n\t\t\n\nOriginal source SHA256: c732e693a6370a0abdf3b54f34ff456304a4a25025303c508a48559f1bee73e6"
  - id: software-source-065
    content_kind: supplied_content
    template:
      scope: local
      id: case-alt-source-065-quote-outcome-right
    brief: context/software-source-065.md
    values:
      eyebrow: CONSTRUCTION SOFTWARE PROVIDER
      title: De-risk the PRO App relaunch
      source: 'Source: supplied West Monroe case study.'
      metric0.value: ~$5M
      metric0.label: Initial investment de-risked
      metric1.value: Potential
      metric1.label: Productivity benefits require implementation
      challenge.label: CHALLENGE
      challenge.body: The client wanted to modernize the PRO App, reach a new user group and align the roadmap to near-term objectives.
      approach.label: WHAT WE DID
      approach.body: Product-first epics from end-user input; prioritize usability, maintenance cost and productivity; identify reusable modular AI assets.
      quote.text: The team was able to come up to speed quickly, identify areas of improvement for the solution along with creating thorough documentation to support the application going forward. The team was also able to understand the business quickly and work with end users to identify future needs.
      quote.by: Chief Information Officer
      proof.text: INVESTMENT
    notes: "\n\nSAFe Built\n\n65\n\nORIGINAL SOURCE — COMPLETE VISIBLE COPY\n\n© 2026 West Monroe Partners  |  Reproduction and/or distribution without West Monroe Partners’ prior consent is prohibited.\n\n65\n\nCLIENT STORIES\n\n\n\nThe team was able to come up to speed quickly, identify areas of improvement for the solution along with creating thorough documentation to support the application going forward. The team was also able to understand the business quickly and work with end users to identify future needs.\n— Chief Information Officer\n\n\n\n$5M\n\nInvestment\n\nDe-risked\n\nThe project de-risked an initial $5M investment\n\nClient was seeking help to modernize their PRO App and relaunch it with a new user group. They also wanted help to evaluate their existing product strategy & roadmap against near-term business objectives.\n\nConstruction Company Software Provider\n\n\n\n\n\nHow can we modernize our app and relaunch it in the market with a new user group? \n\n\tModernization Strategy & Build\n\n\t\tOur modernization effort prioritized features that reduced maintenance cost, increased usability, and improved end-user productivity. The team took a Product-first mindset and relied on direct input from end users to prioritize epics.\n\n\t\tWe rationalized the PRO App to identify modular AI assets that can be re-used and deployed in various parts of the user Journey to improve the overall experience.\n\n\t\tThis project de-risked an initial ~$5 million investment and helped identify opportunities that, when implemented, could yield a significant improvement in productivity\n\n\t\t\n\nOriginal source SHA256: c732e693a6370a0abdf3b54f34ff456304a4a25025303c508a48559f1bee73e6"
