content:
  headline: PRD → signed tech spec → release evidence
  section_label: ENGINEERING · FIRST EXPERIMENT · Product + Engineering Team Lead
  colhead_1:
    label: 01 · PRD
    title: Confirm the problem
  colhead_4:
    label: 02 · TECH SPEC
    title: Keep a human gate
  colhead_7:
    label: 03 · RELEASE
    title: Define the evidence
  text_2:
    text: Start with the existing PRD; no epic exists yet. Product confirms scope and the success measure. Rules Engine platform is undecided.
  text_3:
    text: 'Watch-out: sanctioned tools and PHI rules must be in place.'
  text_5:
    text: The Architecture Design Agent drafts technical design and stories. The Team Lead reviews and signs. Test reuse outside Reconcile AI.
  text_6:
    text: Measure PRD-to-signed-spec time and review rework.
  text_8:
    text: 'Product specifies release notes, PRD reconciliation and destinations. This unblocks the Release Agent. Test ways of working, not production changes.'
  text_9:
    text: Learn what Product needs from release evidence.
