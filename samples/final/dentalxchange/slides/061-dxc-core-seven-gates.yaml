content:
  headline: Stabilize the Core flow with seven gates
  section_label: Move 1 · Stabilize Core SDLC
  card_1:
    body:
      item_01:
        label: Context
      item_02:
        p: Keep Java and Scrum. Same-build promotion is the pipeline touch; settle branching and template environments for two releases in flight.
      item_03:
        label: Claude assists; people approve
      item_04:
        bullets:
          item_01: Draft acceptance criteria and tests
          item_02: 'Size slices; pair on code, unit tests and docs'
          item_03: Pre-review PRs; draft reviewed backlog tests
          item_04: Draft release notes and root-cause summaries
      item_05:
        label: DXC ownership
      item_06:
        bullets:
          item_01: 'Refine: PMs + QA; Plan: scrum master'
          item_02: 'Build: Core engineers; Review: Core lead'
          item_03: 'QA: QA lead; Release: Release + DevOps'
          item_04: 'Patch: Release; keep senior review for high risk'
    label: EXISTING CORE FLOW
    title: Gates on the flow Core already runs
  table_2:
    columns:
      item_01:
        label: '#'
      item_02:
