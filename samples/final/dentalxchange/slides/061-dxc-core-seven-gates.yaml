        d: 'Ready: tests and technical notes before sprint'
        n: "01"
        s: Refine
      item_02:
        d: Reserve a run lane for support and patches
        n: "02"
        s: Plan
      item_03:
        d: 'Code, unit tests and docs before PR'
        n: "03"
        s: Build
      item_04:
        d: PR bot in pipeline + rotating second reviewer
        n: "04"
        s: Review
      item_05:
        d: Critical paths automated; release evidence
        n: "05"
        s: QA
      item_06:
        d: 9–10-day hardening; promote tested build
        n: "06"
        s: Release
      item_07:
        d: RCA within sprint; credential/cert alerts
        n: "07"
        s: Patch
