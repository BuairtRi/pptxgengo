content:
  headline: 'Core SDLC today: seven weak points'
  section_label: Move 1 · Core SDLC today
  card_1:
    body:
      item_01:
        label: Context
      item_02:
        p: 'Core already runs Java and Scrum. Today the delivery number is story points; lead time, failure rate and waiting time are not measured.'
      item_03:
        label: What is already working
      item_04:
        bullets:
          item_01: Two-week sprints; ~65 points; lead assigns by skill
          item_02: Copilot in IntelliJ; Claude for some staff
          item_03: QA automation grew 21 → 200+ in five months
          item_04: Senior Core PR review and production smoke checks
      item_05:
        label: Where control is thin
      item_06:
        bullets:
          item_01: QA and design absent from refinement
          item_02: Support and patches draw on the same people
          item_03: Pre-live is not prod-like; branches merge on release day
          item_04: Most QA is manual; defined path coverage ~10–15%
    label: CURRENT CORE FLOW
    title: A working flow with weak points
  table_2:
    columns:
      item_01:
        label: '#'
      item_02:
        label: Current stage
      item_03:
        label: Observed weakness
    rows:
      item_01:
        d: PMs + engineers vote; QA/design absent
        n: "01"
        s: Refine
      item_02:
        d: Two-week sprint; support uses same capacity
        n: "02"
        s: Plan
      item_03:
        d: Docs after coding; offshore lacks live data
        n: "03"
        s: Build
      item_04:
        d: Senior bottleneck; QA PR bot on demand
        n: "04"
        s: Review
      item_05:
        d: 200+ automated; mostly manual; no load test
        n: "05"
        s: QA
      item_06:
        d: "4-day window;\nUAT / QA 3–4 days"
        n: "06"
        s: Release
      item_07:
        d: 15 unplanned events; causes not trended
        n: "07"
        s: Patch
