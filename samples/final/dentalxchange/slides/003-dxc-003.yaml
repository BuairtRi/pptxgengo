content:
  headline: Artifacts open at a stage and close with a decision
  section_label: IMPLEMENTATION TEMPLATES · sequential and parallel work
  table_1:
    columns:
      item_01:
        label: Ref
      item_02:
        label: Working artifact
      item_03:
        label: Reviewer
      item_04:
        label: PDLC stage
      item_05:
        label: Named decision
      item_06:
        label: Concord gate
    rows:
      item_01:
        a: Opportunity Brief
        b: Concept/Strategy · G0
        n: "01"
        o: Senior leader
        v: 'Is the problem worth defining?'
        w: Identify
      item_02:
        a: Product Brief
        b: Design/Viability · G1/G2
        n: "02"
        o: Senior leader
        v: Approve direction and measures
        w: Define
      item_03:
        a: Feature Brief
        b: Design/Viability → Build
        n: "03"
        o: Product / Eng / QA or Design
        v: 'Ready to build?'
        w: Define→Build
      item_04:
        a: Technical Plan
        b: Build · G4
        n: "04"
        o: Engineering + reviewers
        v: 'Ready to execute?'
        w: Build
      item_05:
        a: Test / QA / UAT Plan
        b: Parallel · Beta / Pilot
        n: "05"
        o: QA; Product accepts UAT
        v: Test evidence supports readiness
        w: Define→Release
      item_06:
        a: Initial Release / GTM
        b: Parallel · G5 launch / G6 review
        n: "06"
        o: Named decision-maker
        v: 'Go, Revise, Hold or Stop'
        w: Define→Optimize
      item_07:
        a: AI assistance today
        b: Release Agent is paused
        n: AI
        o: Human review required
        v: Recon agents; QA uses Claude
        w: Build / Release
      item_08:
        a: Working rules
        b: Link systems; own/date unknowns
        n: RULE
        o: Product + Engineering
        v: 'Approve, Revise, Hold or Stop'
        w: All six stages
