content:
  headline: Four engineering moves answer the findings
  section_label: Engineering moves
  source_note: 'All four: sanctioned Claude, contractors included; DXC accounts, no PHI, human review before merge. No Core re-platforming.'
  bullets_2:
    items:
      item_01: 9–10-day hardening; same tested build promoted
      item_02: 'Hotfix lane, root-cause review and expiry alerts'
      item_03: Both workstreams
  bullets_4:
    items:
      item_01: Ready tests and technical notes; spec before date
      item_02: 'Pair on code, unit tests and docs; PR bot + second reviewer'
      item_03: Reconcile AI engineering across Core
  bullets_6:
    items:
      item_01: 'Automate defined critical paths, ~10–15% today'
      item_02: 'Host QA agents, PR bot and Jira test generator in DXC'
      item_03: QA lead + sanctioned Claude for every tester; Testing & release
  bullets_8:
    items:
      item_01: 'Four delivery measures: frequency, lead time, failure, restore'
      item_02: 'Stage flow, unplanned work and commitment reliability'
      item_03: QA / AI cost measures; both workstreams
  colhead_1:
