    title: Commit with engineering input
  colhead_7:
    label: Common comparison lens
    title: Six dimensions for both
  text_2:
    text: November 2026 MVP target. PRD, Figma, Architecture Spec, technical stories, UAT and Jira exist. Node/Angular/NX on AWS; lead, ~4 developers and 1 DevSecOps/QA. Epic agent pipeline; two-week promotion.
  text_3:
    text: 'Review scale: 100–145-file epic PRs; DevSecOps WIP limit 2. Test ship-with-proof and governed agents.'
  text_5:
    text: Discovery done; commercialization next. PRD + governance deck; no epic. Rough year-end MVP. Platform/team and Core capacity remain undecided.
  text_6:
    text: Aspen / TeamTAG partner-client lane. Resolve Scrum/points versus epic Kanban. Test the signal funnel, definition path and priorities.
  text_8:
    text: Stage today; artifacts; platform and team; delivery approach; open questions; activation tests. The same six dimensions apply to each initiative.
  text_9:
    text: Recon tests release evidence and agentic scale. Rules tests an engineering-informed commitment before setting a date.
