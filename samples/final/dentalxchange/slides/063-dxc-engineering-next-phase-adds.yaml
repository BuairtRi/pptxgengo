content:
  headline: Build on DXC’s assets in the next phase
  section_label: Next phase
  bullets_3:
    items:
      item_01:
        lead: Leadership.
        text: 1h/week + three 1h gates; Core lead 4h/week + workshop.
      item_02:
        lead: QA / Release.
        text: QA lead 4h/week; Release 3h/week.
      item_03:
        lead: DevOps / Security.
        text: DevOps 1 day/week (W2–6); Security one review (W1–3).
      item_04:
        lead: Product / Pilot.
        text: PMs 2h/week; pilot engineers a three-day workshop.
  card_4:
    body:
      item_01:
        p: 'DXC: CAB, calendar, build IDs, QA hardening. WM adds patch RCA, cert inventory, same-build design and VM templating with DevOps.'
    inlinenumber: "01"
    title: Core SDLC
  card_5:
    body:
      item_01:
        p: 'DXC: Scrum, Copilot, some Claude and Reconcile pipeline. WM adds Core skills, Ready / PR gates, workshop and coaching.'
    inlinenumber: "02"
    title: Agile with Claude
  card_6:
    body:
      item_01:
        p: 'DXC: Playwright, agents, PR bot and defined paths. WM adds two full-time QE engineers for one sprint, coverage, AWS hosting and evidence.'
    inlinenumber: "03"
    title: Robust QA
  card_7:
    body:
      item_01:
        p: 'DXC: Jira, calendar, build IDs and QA AI-cost log. WM adds definitions, cause codes and dashboard aligned with Product metrics.'
    inlinenumber: "04"
    title: Metrics
  text_1:
    text: DXC EFFORT · ESTIMATES
  text_2:
    text: Confirm time with each owner
