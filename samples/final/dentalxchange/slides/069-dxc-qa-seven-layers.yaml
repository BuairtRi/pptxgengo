content:
  headline: 'Robust QA: scale existing tools in seven layers'
  section_label: Move 3 · Scale QA’s existing framework
  card_1:
    body:
      item_01:
        label: Context
      item_02:
        p: 'Keep the Playwright framework and Claude tools QA already built. Productionize the agents, PR bot and Jira story-to-test generator.'
      item_03:
        label: Current capacity and limits
      item_04:
        bullets:
          item_01: One leader for ~15 testers; two full-time staff
          item_02: 'Core: 200+ automated tests, but mostly manual'
          item_03: Defined critical paths ~10–15%; no performance tests
          item_04: UAT / QA has only 3–4 days today
      item_05:
        label: What the next phase adds
      item_06:
        bullets:
          item_01: Name or hire a QA lead for Core
          item_02: Sanctioned Claude practice for contractors too
          item_03: Two full-time QE engineers for one sprint
          item_04: 'DXC hosting, pipeline integration and release evidence'
    label: BUILD ON FIVE MONTHS OF QA WORK
    title: Layer by layer; reviewed by people
  table_2:
    columns:
      item_01:
        label: '#'
      item_02:
        label: QA layer
      item_03:
        label: Owner / change
    rows:
      item_01:
        d: 'QA lead + PM: criteria / tests before build'
        n: "01"
        s: Refinement
      item_02:
        d: 'Core + Claude: reviewed tests on changed code'
        n: "02"
        s: Unit
      item_03:
        d: 'QA: daily agents and PR-reviewed test backlog'
        n: "03"
        s: API / UI
      item_04:
        d: 'QA + Product: automate defined paths by release'
        n: "04"
        s: Critical paths
      item_05:
        d: 'QA + DevOps: highest-volume baseline'
        n: "05"
        s: Performance
      item_06:
        d: 'Product: realistic pre-live, hardening window'
        n: "06"
        s: UAT
      item_07:
        d: 'Release + DevOps: smoke checks + evidence'
        n: "07"
        s: Prod checks
