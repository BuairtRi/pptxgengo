        w: W6
      item_07:
        a: Not tracked → ≥80%
        d: Pilot / Ready check
        ph: Flow
        s: Ready stories
        w: W6
      item_08:
        a: Some FT; no contractors → 100%
        d: W2 access decision
        ph: Access
        s: Sanctioned AI
        w: W3
      item_09:
        a: Not consistent → 100% new commitments
        d: Spec-before-date
        ph: Commit
        s: Signed spec
        w: W2+
      item_10:
        a: 'Not measured → baseline, then targets'
        d: Need baseline first
        ph: Measure
        s: 4 delivery metrics
        w: W2/6
      item_11:
        a: Confirm all proposed targets at week 2
        d: Owner agreement
        ph: Confirm
        s: Target hypotheses
        w: W2
      item_12:
        a: Review evidence; decide what scales
        d: Next-pod decision
        ph: Review
        s: Scorecard / scale
        w: W6
