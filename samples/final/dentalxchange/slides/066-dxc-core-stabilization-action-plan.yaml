content:
  headline: 'Stabilize Core SDLC: action plan'
  section_label: Move 1 · Testing & release controls
  source_note: 'W2: decide triage owner, hardening, promotion rule and environment funding. Measures: unplanned share, repeats, window, matching builds.'
  table_1:
    columns:
      item_01:
        label: Action
      item_02:
        label: What / done when
      item_03:
        label: DXC owner
      item_04:
        label: WM role
      item_05:
        label: Weeks
    rows:
      item_01:
        a: Patch triage
        b: Classify 15 unplanned events; every event has cause + owner
        c: Release
        d: QE Architect
        e: W1–2
      item_02:
        a: Cert inventory
        b: 'Inventory expiry, owner and alert; 100% owned / alerted'
        c: Release + DevOps
        d: QE Architect
        e: W1–3
      item_03:
        a: Hardening
        b: Adopt 9–10 days; settle branching; first release in new window
        c: Leadership + QA + Release
        d: Exec Eng Leader
        e: W1–3
      item_04:
        a: VM templates
        b: Support two releases in flight; no environment conflict
        c: DevOps + app architects
        d: QE Architect
        e: W2–6
      item_05:
        a: Same build
        b: Promote tested pre-live build; IDs match for every release
        c: DevOps + Release
        d: QE Architect
        e: W3–6
      item_06:
        a: Hotfix lane
        b: Review patch / rollback cause within sprint; RCA before close
        c: Release + Core lead
        d: QE Architect
        e: W2–6
