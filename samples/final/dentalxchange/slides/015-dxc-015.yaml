  headline: Three tests turn recommendations into evidence
  section_label: DELIVERABLE 02 · bounded working tests
  colhead_1:
    label: 01 · Signal funnel
    title: Test the opportunity
  colhead_4:
    label: 02 · Definition path
    title: Test the handoffs
  colhead_7:
    label: 03 · Ship with proof
    title: Test release evidence
  text_2:
    text: 'Run one internal signal through an opportunity brief with an outcome and decision criterion. Watch signal quality, decision speed and next-step clarity.'
  text_3:
    text: 'Weekly Product, Engineering and initiative-owner review.'
  text_5:
    text: 'Carry a brief through PRD, feature/epic, technical design and plan. Watch handoff quality, rework, design context and decision clarity.'
  text_6:
    text: Joint Product and Engineering review before commitment.
  text_8:
    text: 'Define the smallest evidence path before a release or client-facing test. Watch validation coverage, earlier issue discovery and owner clarity.'
  text_9:
    text: 'Before-release review, then post-launch learning. Record results, open questions and continued-use recommendations.'
