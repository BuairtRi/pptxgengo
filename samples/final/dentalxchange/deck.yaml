  - id: dxc-003
    hidden: false
    notes: |-
      Source: pdlc_stage field and review decision record of each template, and the Commercialization Framework (the Concord). Concord mapping: Identify = Concept & Strategy (G0); Define = Design & Viability (G1 funds the build, G2 commits capacity on the solution design brief and delivery plan); Build = Build (G4 Commercial Readiness sign-off); Release = Beta and, where needed, Pilot; Go-to-Market = Launch (G5); Optimize = post-launch review (G6). G3 certification is conditional and runs in parallel when new payers or partners are involved. Implication: G2 commits capacity on the solution design brief and delivery plan, which is the content of the Technical Implementation Plan. The plan should therefore start before the capacity commitment, at the end of Define, even though the template places it in Build. Practices Map row: Prioritization sits inside the Opportunity Brief review decision, and Optimize corresponds to the Measurement and feedback row. Decision-makers follow the templates; the ownership matrix on the next slide still needs to be aligned for the Feature Brief, Technical Implementation Plan, and Testing plan approvers. AI row: agents documented in the Reconcile AI Agentic Spec-Driven Delivery document (the Release Agent is deferred until Product defines its outputs); none are documented yet for Identify, Define, Go-to-Market, or Optimize. The Technical Implementation Plan's section 6 requires named human review for any AI-assisted work.

      Working rules come from the README's evidence and decision rules; the step-by-step usage instructions stay in the README itself.

      The Build cell also reflects the QA working session: QA uses Claude to create tests and diagnose failures, with access currently limited to some full-time staff.

