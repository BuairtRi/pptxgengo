      E1 sources: 2024–2026 release calendar (Core applications), release management and Core engineering working sessions (CAB process, configuration switches), and the readout finding on quality. The 15 unplanned 2026 changes are 11 patches, 2 off-version releases, and 2 rollbacks; see the notes on the release health baseline for the breakdown by cause.


      SOURCE PRESERVATION — original slide 49
      Release stability and production quality

      Learn from what reaches production and stop repeat causes, starting with Core.

      ENGINEERING E1

      WHAT SHOULD BE DONE

      Review the root cause of every unplanned production change: patches, rollbacks, and off-version releases.

      Manage credentials and certificates as a lifecycle, with expiry dates, owners, and alerts.

      Make releases repeatable: promote the same validated artifact, onboard new products to CAB, and clarify how the release rule applies to code behind a configuration switch.

      HOW TO ACTIVATE IT

      Now (Core): classify the 15 unplanned 2026 changes by cause and build the credential and certificate inventory.

      Next: a standard review after every patch or rollback, expiry alerts, and same-artifact promotion.

      Future: change failure rate, time to restore, and repeat causes tracked on every pod.

      Owner: Engineering leadership + Release/DevOps + Quality | Dependency: release calendar, Jira, CAB records | Measure: share of unplanned changes, change failure rate, and repeat causes
