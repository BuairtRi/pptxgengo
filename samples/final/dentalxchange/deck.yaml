      SOURCE PRESERVATION — original slide 31
      Extend the Reconcile AI pocket into reusable, human-supervised practices across the PDLC.

      ENGINEERING E5

      WHAT SHOULD BE DONE

      Classify lifecycle tasks that are safe to automate, require assistance, or require mandatory human review, and name the sanctioned tools for PHI-bearing work.

      Create reusable skills, prompts, documentation, and versioning that teams can discover and reuse.

      Track speed and quality together through cycle time, defects, rework, cost, and review evidence.

      HOW TO ACTIVATE IT

      Now (Reconcile AI): classify pipeline steps as automate, assist, or human review, and name the sanctioned tools for PHI-bearing work.

      Next: extend to Eligibility AI with a shared agent registry, and pilot a light, human-gated pattern on Core, ahead of the December rollout.

      Future: scale only the patterns that improve speed and quality together.

