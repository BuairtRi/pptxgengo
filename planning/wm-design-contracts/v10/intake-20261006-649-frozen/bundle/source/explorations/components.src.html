<meta charset="utf-8">
<title>WM Design System</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<style>
/* Layout: a component reference rendered from components/v0/components.json. Taxonomy first, then each component as full-width strips of the slide (960 pt wide) drawn in true points. Single light theme by design. */
:root {
  color-scheme: light;
  --grounded: #070154; --deep: #05013F; --white: #FFFFFF;
  --gray-dark: #50658E; --gray-dim: #97A4BA; --gray-med: #CED7E6; --gray-light: #E8EEF8;
  --yellow: #F6EB21; --magenta: #F900D3; --blue: #0047FF;
  --sans: "IBM Plex Sans", "Helvetica Neue", Arial, sans-serif;
  --mono: "IBM Plex Mono", "SF Mono", Menlo, Consolas, monospace;
  --bg: var(--white); --fg: var(--grounded);
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--fg); font-family: var(--sans); font-size: 15px; line-height: 1.55; margin: 0; }
.wrap { max-width: 1180px; margin: 0 auto; padding-inline: 24px; padding-block: 56px 96px; }
h1, h2, h3 { font-weight: 600; letter-spacing: -0.02em; text-wrap: balance; margin: 0; }
h1 { font-size: clamp(32px, 4.6vw, 52px); line-height: 1.05; letter-spacing: -0.03em; max-width: 18ch; }
h2 { font-size: 26px; line-height: 1.15; }
p { margin: 0; max-width: 72ch; }
.eyebrow { font-family: var(--mono); font-size: 12px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--blue); }
header.top { display: grid; gap: 18px; padding-bottom: 32px; border-bottom: 2px solid var(--grounded); }
header.top p { font-size: 17px; color: var(--gray-dark); }
.changes { display: grid; gap: 4px; font-size: 13px; color: var(--gray-dark); padding: 14px 16px; background: var(--gray-light); max-width: 900px; }
.changes b { color: var(--grounded); }
.toolbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); display: flex; flex-wrap: wrap; gap: 10px 22px; align-items: center; padding-block: 14px; border-bottom: 1px solid var(--gray-med); font-size: 13px; color: var(--gray-dark); }
.toolbar label { display: inline-flex; gap: 8px; align-items: center; color: var(--grounded); font-weight: 500; cursor: pointer; }
.toolbar input { width: 16px; height: 16px; accent-color: var(--grounded); }
.toolbar input:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }
.toolbar nav { display: flex; flex-wrap: wrap; gap: 4px 14px; }
.toolbar nav a { color: var(--grounded); text-decoration: none; font-family: var(--mono); font-size: 11.5px; }
.toolbar nav a:hover, .toolbar nav a:focus-visible { text-decoration: underline; }
[hidden] { display: none !important; }
section.block { padding-block: 56px 8px; display: grid; grid-template-columns: minmax(0, 1fr); gap: 22px; }
.sec-head { display: grid; gap: 8px; }
.sec-head p { color: var(--gray-dark); }
.tax { display: grid; border-top: 2px solid var(--grounded); }
.tax-layer { display: grid; grid-template-columns: 150px 1fr; gap: 20px; padding: 16px 0; border-bottom: 1px solid var(--gray-med); }
.tax-groups { display: grid; gap: 10px; min-width: 0; }
.tax-group { display: grid; grid-template-columns: 230px 1fr; gap: 12px; align-items: baseline; }
.tax-group .g { font-weight: 600; font-size: 14px; display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
.tax-group .items { font-size: 13.5px; color: var(--gray-dark); }
.batch { font-family: var(--mono); font-size: 10.5px; font-weight: 600; padding: 1px 6px; border: 1px solid var(--gray-med); color: var(--gray-dark); white-space: nowrap; }
.batch.now { background: var(--grounded); border-color: var(--grounded); color: #fff; }
.batch.blocked { border-color: var(--magenta); color: #B000A0; }
.anat { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 0 28px; border-top: 2px solid var(--grounded); }
.anat div { padding: 12px 0; border-bottom: 1px solid var(--gray-med); display: grid; gap: 3px; font-size: 13px; }
.anat b { font-family: var(--mono); font-size: 12px; font-weight: 600; }
.anat span { color: var(--gray-dark); }
.rules { display: grid; gap: 6px; padding-left: 0; margin: 0; list-style: none; font-size: 13.5px; }
.rules li { position: relative; padding-left: 16px; }
.rules li::before { content: ""; position: absolute; left: 0; top: 8px; width: 5px; height: 5px; background: var(--grounded); }
.group-title { padding-top: 48px; border-bottom: 2px solid var(--grounded); padding-bottom: 8px; font-family: var(--mono); font-size: 12px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--blue); }
.comp { display: grid; gap: 14px; padding-top: 30px; }
.comp-head { display: grid; grid-template-columns: 1fr auto; gap: 4px 16px; align-items: baseline; }
.comp-head h3 { font-size: 20px; }
.comp-head .id { font-family: var(--mono); font-size: 11.5px; color: var(--gray-dark); }
.comp-head p { grid-column: 1 / -1; font-size: 14px; color: var(--gray-dark); }
.chips { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 6px; }
.chip { font-family: var(--mono); font-size: 11px; padding: 2px 8px; border: 1px solid var(--gray-med); }
.chip.sz { background: var(--gray-light); border-color: var(--gray-light); }
.ex { display: grid; gap: 6px; margin: 0; }
.ex figcaption { font-family: var(--mono); font-size: 11px; letter-spacing: .04em; color: var(--gray-dark); }

/* stage: a strip of the slide, 960 pt wide */
.stage { container-type: inline-size; width: 100%; max-width: 100%; position: relative; overflow: hidden; outline: 1px solid var(--gray-med); --pt: calc(100cqw / 960); }
.stage > * { position: absolute; margin: 0; }
.t { overflow-wrap: break-word; }
.st-display { font-family: var(--sans); font-weight: 600; font-size: calc(54*var(--pt)); line-height: calc(60*var(--pt)); letter-spacing: -0.025em; }
.st-title { font-family: var(--sans); font-weight: 600; font-size: calc(32*var(--pt)); line-height: calc(36*var(--pt)); letter-spacing: -0.02em; }
.st-heading { font-family: var(--sans); font-weight: 600; font-size: calc(24*var(--pt)); line-height: calc(30*var(--pt)); letter-spacing: -0.015em; }
.st-subhead { font-family: var(--sans); font-weight: 600; font-size: calc(18*var(--pt)); line-height: calc(24*var(--pt)); letter-spacing: -0.01em; }
.st-lead { font-family: var(--sans); font-size: calc(16*var(--pt)); line-height: calc(24*var(--pt)); }
.st-body { font-family: var(--sans); font-size: calc(14*var(--pt)); line-height: calc(21*var(--pt)); }
.st-small { font-family: var(--sans); font-size: calc(12*var(--pt)); line-height: calc(18*var(--pt)); }
.st-stat { font-family: var(--mono); font-weight: 600; font-size: calc(48*var(--pt)); line-height: calc(48*var(--pt)); letter-spacing: -0.02em; white-space: nowrap; }
.st-stat-sm { font-family: var(--mono); font-weight: 600; font-size: calc(36*var(--pt)); line-height: calc(36*var(--pt)); letter-spacing: -0.02em; white-space: nowrap; }
.st-eyebrow { font-family: var(--mono); font-weight: 600; font-size: calc(10*var(--pt)); line-height: calc(12*var(--pt)); letter-spacing: 0.08em; text-transform: uppercase; }
.st-source { font-family: var(--sans); font-size: calc(9*var(--pt)); line-height: calc(12*var(--pt)); }
.fn { font-size: 0.6em; vertical-align: super; line-height: 0; font-weight: 600; margin-left: 0.06em; }
.stampx { display: flex; align-items: center; height: calc(18*var(--pt)); padding: 0 calc(6*var(--pt)); font-family: var(--mono); font-weight: 600; font-size: calc(8*var(--pt)); letter-spacing: 0.08em; text-transform: uppercase; white-space: nowrap; }
.numtab { display: grid; grid-template-columns: 1fr 160px 60px; column-gap: 18px; font-size: 13px; }
.numtab > div { padding: 7px 0; border-bottom: 1px solid var(--gray-med); }
.numtab .i { font-family: var(--mono); font-size: 11.5px; color: var(--gray-dark); }
.numtab .o { font-family: var(--mono); font-weight: 600; font-size: 15px; }
.numtab .h { font-family: var(--mono); font-size: 10.5px; letter-spacing: .06em; text-transform: uppercase; color: var(--gray-dark); }
.st-footer { font-family: var(--mono); font-size: calc(7*var(--pt)); line-height: calc(9*var(--pt)); }
.foot img { display: block; width: auto; max-width: none; }
.st-label { font-family: var(--mono); font-weight: 500; font-size: calc(9*var(--pt)); line-height: calc(12*var(--pt)); letter-spacing: 0.06em; text-transform: uppercase; }
.st-number { font-family: var(--mono); font-weight: 600; font-size: calc(18*var(--pt)); line-height: calc(24*var(--pt)); }
.b600 { font-weight: 600; }
/* Highlight: inline, wraps with the text; each line fragment gets its own mark */
.hl { background: url("{{HL}}") center 58% / 100% 82% no-repeat; padding-inline: 0.1em; margin-inline: -0.05em; -webkit-box-decoration-break: clone; box-decoration-break: clone; }
.hl.v2 { background-image: url("{{HL2}}"); } .hl.v3 { background-image: url("{{HL3}}"); } .hl.v4 { background-image: url("{{HL4}}"); }
.cir, .spk { position: relative; display: inline-block; }
.cir { padding-inline: 0.2em; margin-inline: -0.05em; }
.cir > svg { position: absolute; left: -16%; width: 132%; top: -28%; height: 150%; overflow: visible; }
/* the spark is a burst around an empty center: center it on the top-right corner of the word */
.spk > svg { position: absolute; left: calc(100% - 0.55em); top: -0.95em; width: 1.5em; height: auto; overflow: visible; }
.spk { margin-right: 0.75em; }
.us { position: relative; display: inline-block; }
.us > svg { position: absolute; left: -3%; width: 106%; top: 86%; height: auto; overflow: visible; }
.stack { display: flex; flex-direction: column; }
.row { display: flex; align-items: center; }
.sq-list { list-style: none; padding: 0; margin: 0; display: grid; gap: calc(6*var(--pt)); }
.sq-list li { position: relative; padding-left: calc(15*var(--pt)); }
.sq-list li::before { content: ""; position: absolute; left: 0; top: calc(8.5*var(--pt)); width: calc(4*var(--pt)); height: calc(4*var(--pt)); background: currentColor; }
.sq-list .sq-list { margin-top: calc(6*var(--pt)); }
.sq-list.st-small { gap: calc(3*var(--pt)); }
.sq-list.st-small li { padding-left: calc(12*var(--pt)); }
.sq-list.st-small li::before { top: calc(7*var(--pt)); width: calc(3*var(--pt)); height: calc(3*var(--pt)); }
.ol-list.st-small { gap: calc(3*var(--pt)); }
.ol-list.st-small li { grid-template-columns: calc(15*var(--pt)) 1fr; }
.sq-list .sq-list li::before { width: calc(3*var(--pt)); height: calc(3*var(--pt)); background: transparent; outline: calc(0.75*var(--pt)) solid currentColor; outline-offset: calc(-0.75*var(--pt)); top: calc(9*var(--pt)); }
.ol-list { list-style: none; padding: 0; margin: 0; display: grid; gap: calc(6*var(--pt)); }
.ol-list li { display: grid; grid-template-columns: calc(18*var(--pt)) 1fr; }
.sn-list { list-style: none; padding: 0; margin: 0; display: grid; gap: calc(12*var(--pt)); }
.sn-list li { display: grid; align-items: baseline; column-gap: calc(12*var(--pt)); }
.idx-row { position: absolute; display: grid; align-items: center; border-bottom: calc(0.75*var(--pt)) solid var(--line); }
.sch-row { position: absolute; display: grid; align-items: baseline; column-gap: calc(18*var(--pt)); }
.card { display: flex; flex-direction: column; overflow: hidden; }
.card .edge { position: absolute; z-index: 1; }
.card .media { flex: none; width: 100%; object-fit: cover; display: block; }
.card .band { flex: none; display: flex; flex-direction: column; }
.card .inner { display: flex; flex-direction: column; min-height: 0; flex: 1; }
.card .cols { display: grid; grid-template-columns: 1fr 1fr; gap: calc(18*var(--pt)); }
.card .cols > div { display: flex; flex-direction: column; gap: calc(6*var(--pt)); min-width: 0; }
.card .side { display: grid; column-gap: calc(12*var(--pt)); align-items: start; }
.card .side > div { display: flex; flex-direction: column; gap: calc(6*var(--pt)); min-width: 0; }
.ttl { display: flex; align-items: baseline; gap: calc(9*var(--pt)); }
.warn-box { outline: calc(1.5*var(--pt)) dashed var(--magenta); outline-offset: calc(3*var(--pt)); }
.warn { position: absolute; z-index: 3; font-family: var(--mono); font-size: calc(7.5*var(--pt)); font-weight: 600; letter-spacing: .06em; text-transform: uppercase; background: #fff; color: #B000A0; border: calc(0.75*var(--pt)) solid var(--magenta); padding: calc(1*var(--pt)) calc(4*var(--pt)); white-space: nowrap; }
.status { display: inline-flex; align-items: center; gap: calc(6*var(--pt)); }
.status i { display: block; width: calc(8*var(--pt)); height: calc(8*var(--pt)); outline: calc(0.75*var(--pt)) solid var(--grounded); }
.initials { width: calc(54*var(--pt)); height: calc(54*var(--pt)); display: flex; align-items: center; justify-content: center; font-family: var(--mono); font-weight: 600; font-size: calc(16*var(--pt)); letter-spacing: .04em; flex: none; }
.grp { display: flex; align-items: center; gap: calc(12*var(--pt)); }
.grp .line { flex: 1; height: calc(0.75*var(--pt)); }
.ico { display: block; flex: none; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; overflow: visible; }
.shape-text { display: flex; align-items: center; justify-content: center; text-align: center; padding-inline: calc(12*var(--pt)); }
.lbl-patch { position: absolute; transform: translate(-50%, -50%); padding: 0 calc(4*var(--pt)); }
.gtab { display: flex; align-items: center; justify-content: center; overflow: hidden; }
.gtab span { transform: rotate(-90deg); white-space: nowrap; font-family: var(--mono); font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; font-size: calc(8*var(--pt)); }
.chip-g { display: flex; align-items: center; white-space: nowrap; padding: 0 calc(6*var(--pt)); height: calc(18*var(--pt)); }
.icon-demo { display: flex; flex-wrap: wrap; gap: 12px; margin-bottom: 18px; }
.icon-demo-cell { display: flex; align-items: center; gap: 14px; padding: 16px 18px; border: 1px solid var(--gray-medium, #CED7E6); }
.icon-demo-cell span { font-family: var(--mono); font-size: 11px; margin-left: 6px; }
.icon-filter { width: 100%; max-width: 420px; padding: 8px 10px; font: inherit; border: 1px solid #CED7E6; margin-bottom: 14px; }
.icon-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(112px, 1fr)); gap: 4px; }
.icon-grid figure { margin: 0; padding: 12px 6px 8px; display: flex; flex-direction: column; align-items: center; gap: 8px; min-width: 0; }
.icon-grid figure:hover { background: #E8EEF8; }
.icon-grid figcaption { font-family: var(--mono); font-size: 10px; color: #50658E; text-align: center; overflow-wrap: anywhere; }
.fam-sum { margin: -6px 0 14px; color: #50658E; font-size: 13.5px; max-width: 70ch; }
.pill.tier-core { background: #E8EEF8; color: #070154; }
.pill.tier-working { background: #070154; color: #FFFFFF; }
/* Templates: toolbar + family rail */
.tp-head .sec-head { margin-bottom: 8px; }
.tp-filters { display: grid; gap: 8px; font-size: 12.5px; color: var(--gray-dark); background: var(--bg); padding-block: 10px; border-bottom: 1px solid var(--gray-med); position: sticky; top: 0; z-index: 4; }
.tpf-row { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; }
.tpf-row label { min-width: 0; display: flex; gap: 6px; align-items: center; font-family: var(--mono); font-size: 11px; text-transform: uppercase; letter-spacing: .04em; }
.tpf-row select, .tpf-row input { min-width: 0; font: 13px var(--sans); text-transform: none; letter-spacing: 0; padding: 5px 6px; border: 1px solid #CED7E6; background: #FFFFFF; color: var(--grounded); }
#tpf-q { flex: 1 1 280px; padding: 7px 10px; }
.tpf-range { display: inline-flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.tpf-count { margin-left: auto; font-family: var(--mono); font-size: 11.5px; color: var(--grounded); white-space: nowrap; }
.tpf-famtoggle { display: none; font: 600 12.5px var(--sans); padding: 6px 10px; border: 1px solid var(--grounded); background: #FFFFFF; color: var(--grounded); cursor: pointer; }
.tpf-active { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.tpf-note { font-size: 12px; color: var(--gray-dark); margin-right: 4px; }
.tpf-chip { font: 12px var(--sans); padding: 4px 8px 4px 10px; border: 1px solid var(--grounded); background: var(--grounded); color: #FFFFFF; cursor: pointer; display: inline-flex; gap: 8px; align-items: center; }
.tpf-chip span { font-size: 14px; line-height: 1; opacity: .8; }
.tpf-chip:hover span { opacity: 1; }
.tpf-clearall { font: 600 12px var(--sans); background: none; border: 0; color: var(--blue); text-decoration: underline; cursor: pointer; padding: 4px; }
.tpl-layout { display: grid; grid-template-columns: 236px minmax(0, 1fr); gap: 36px; align-items: start; margin-top: 18px; }
.tp-side { position: sticky; top: var(--tp-stick, 120px); max-height: calc(100vh - var(--tp-stick, 120px) - 12px); overflow-y: auto; padding-right: 6px; display: grid; gap: 14px; align-content: start; }
.tps-glabel { font-family: var(--mono); font-size: 10.5px; letter-spacing: .06em; text-transform: uppercase; color: var(--gray-dark); margin: 0 0 4px 10px; }
.tps-item, .tps-sec { display: flex; justify-content: space-between; gap: 8px; width: 100%; text-align: left; font: 13px/1.3 var(--sans); color: var(--grounded); background: none; border: 0; border-left: 3px solid transparent; padding: 5px 8px 5px 10px; cursor: pointer; }
.tps-item span, .tps-sec span { font-family: var(--mono); font-size: 11px; color: var(--gray-dark); }
.tps-item:hover, .tps-sec:hover { background: #F3F6FC; }
.tps-item.on { border-left-color: var(--blue); background: #E8EEF8; font-weight: 600; }
.tps-all { font-weight: 600; border-bottom: 1px solid var(--gray-med); padding-bottom: 8px; }
.tps-all.on { font-weight: 700; }
.tps-item.zero, .tps-sec.zero { color: #97A4BA; }
.tps-secs { display: grid; margin: 2px 0 6px 12px; border-left: 1px solid var(--gray-med); }
.tps-sec { font-size: 12.5px; padding-block: 4px; }
.tps-sec.on { border-left-color: var(--grounded); font-weight: 600; }
.tps-item:focus-visible, .tps-sec:focus-visible, .tpf-chip:focus-visible, .tpf-famtoggle:focus-visible { outline: 2px solid var(--blue); outline-offset: 1px; }
.tp-main { min-width: 0; }
.tp-main .tp-fam { padding-block: 0 40px; }
.tp-main .tp-fam .group-title { margin-top: 0; }
.tp-empty { padding: 24px; background: #F3F6FC; color: var(--grounded); }
.tp-empty button { font: 600 13px var(--sans); background: none; border: 0; color: var(--blue); text-decoration: underline; cursor: pointer; }
@media (max-width: 899px) {
  .tpl-layout { grid-template-columns: minmax(0, 1fr); }
  .tpf-famtoggle { display: inline-block; }
  .tp-side { display: none; position: static; max-height: none; border: 1px solid var(--gray-med); padding: 12px; }
  .tp-side.open { display: grid; }
  .tpf-count { margin-left: 0; }
}
.tp-n { font-family: var(--mono); font-size: 12px; color: #50658E; font-weight: 400; }
.tp-sub { margin-top: 18px; }
.tp-sub-title { font-size: 16px; margin: 0 0 10px; padding-top: 10px; border-top: 2px solid var(--grounded); }
.pill.tier-new { background: #0047FF; color: #FFFFFF; border-color: #0047FF; }
.pill.tier-rev { background: #FFFFFF; color: #0047FF; border-color: #0047FF; }
.pill.tier-deprecated { background: #FFFFFF; color: #50658E; border-style: dashed; }
.guide-line { border-top: calc(1*var(--pt)) dashed #0047FF; display: none; }
.show-grid .guide-line { display: block; }
.overlay { inset: 0; pointer-events: none; display: none; position: absolute; width: 100%; height: 100%; z-index: 4; }
.show-grid .overlay { display: block; }
.overlay .ov5 { display: none; }
.show-5up .overlay .ov5 { display: inline; }
.show-5up .overlay .ov12 { display: none; }
code { font-family: var(--mono); font-size: 0.88em; background: var(--gray-light); padding: 1px 5px; }
@media (max-width: 720px) { .tax-layer, .tax-group { grid-template-columns: 1fr; gap: 6px; } }
.toolbar { gap: 10px 22px; justify-content: space-between; }
.tabs { display: flex; flex-wrap: wrap; gap: 0; border: 1px solid var(--gray-med); }
.tabs button { font: 600 13px/1 var(--sans); color: var(--grounded); background: var(--white); border: 0; border-right: 1px solid var(--gray-med); padding: 11px 16px; cursor: pointer; }
.tabs button:last-child { border-right: 0; }
.tabs button[aria-selected="true"] { background: var(--grounded); color: var(--white); }
.tabs button:hover:not([aria-selected="true"]) { background: var(--gray-light); }
.tabs button:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; position: relative; }
.tabs button .n { font: 500 11px/1 var(--mono); margin-left: 6px; opacity: .75; }
.subnav { display: flex; flex-wrap: wrap; gap: 4px 14px; padding-block: 12px; border-bottom: 1px solid var(--gray-med); }
.subnav a { color: var(--grounded); text-decoration: none; font-family: var(--mono); font-size: 11.5px; }
.subnav a:hover, .subnav a:focus-visible { text-decoration: underline; }
.panel { padding-top: 8px; }
.lead-p { font-size: 16px; color: var(--gray-dark); max-width: 76ch; }
.layers { display: grid; border-top: 2px solid var(--grounded); }
.layers > div { display: grid; grid-template-columns: 170px 1fr 220px; gap: 18px; padding: 14px 0; border-bottom: 1px solid var(--gray-med); align-items: baseline; font-size: 14px; }
