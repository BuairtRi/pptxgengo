# All platform artifacts and evidence publish privately in this GitLab project.
.release-rules:
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-rc\.[1-9][0-9]*)?$/ && $CI_COMMIT_REF_PROTECTED == "true"'
    - when: never

.release-linux:
  extends: .release-rules
  image:
    name: gitlab-registry.samcott.com/riscott/ci-images/vault-tools-release-security:v2-pinned-dad226a5c05106a33c5b5b79d9d2cca0798a46ca@sha256:3fbf2f78efe3e3c2bab885d9e15d21e769e92f8e53d47908c3532888c356752a
    entrypoint: [""]
  timeout: 30 minutes
  interruptible: false
  variables:
    GOTOOLCHAIN: local
    GOFLAGS: -mod=readonly
    CGO_ENABLED: '0'
    GOMODCACHE: $CI_PROJECT_DIR/.cache/release-go-mod
  before_script:
    - source scripts/release/use-linux-go.sh
  artifacts:
    when: on_success
    expire_in: 14 days
    access: maintainer

.release-macos:
  extends: .release-rules
  tags: [macos]
  timeout: 45 minutes
  interruptible: false
  resource_group: pptxgengo-macos-signing
  variables:
    GOTOOLCHAIN: local
    GOFLAGS: -mod=readonly
    CGO_ENABLED: '0'
    GOPATH: /Users/admin/.gocache-ci/pptxgengo/go
    GOMODCACHE: /Users/admin/.gocache-ci/pptxgengo/mod
    GOCACHE: /Users/admin/.gocache-ci/pptxgengo/build
  before_script:
    - source scripts/release/use-macos-go.sh
  artifacts:
    when: on_success
    expire_in: 14 days
    access: maintainer

release:resources:
  extends: .release-linux
  stage: build
  needs:
    - {job: developer, artifacts: false}
    - {job: pr-relay-unit, artifacts: false}
    - {job: installation-process, artifacts: false}
    - {job: installation-process-arm64, artifacts: false}
    - {job: offline-model, artifacts: false}
    - {job: workflow-lint, artifacts: false}
    - {job: macos-cli, artifacts: false}
    - {job: security:go, artifacts: false}
    - {job: security:secrets, artifacts: false}
    - {job: security:offline-model, artifacts: false}
  script:
    - apt-get update && apt-get install -y --no-install-recommends python3
    - bash scripts/release/prepare-resources.sh
  artifacts:
    paths: [dist/resources/]

release:build:
  extends: .release-linux
  stage: build
  needs:
    - {job: developer, artifacts: false}
    - {job: pr-relay-unit, artifacts: false}
    - {job: installation-process, artifacts: false}
    - {job: installation-process-arm64, artifacts: false}
    - {job: offline-model, artifacts: false}
    - {job: workflow-lint, artifacts: false}
    - {job: macos-cli, artifacts: false}
    - {job: security:go, artifacts: false}
    - {job: security:secrets, artifacts: false}
    - {job: security:offline-model, artifacts: false}
  parallel:
    matrix:
      - RELEASE_TARGET: [linux-amd64, linux-arm64, windows-amd64, windows-arm64, darwin-amd64, darwin-arm64]
  script:
    - bash scripts/release/build.sh "$RELEASE_TARGET"
  artifacts:
    paths: [dist/unsigned/$RELEASE_TARGET/]

release:windows-sign:
  extends: .release-linux
  stage: sign
  image:
    name: gitlab-registry.samcott.com/riscott/ci-images/vault-tools-windows-signing:v2-pinned-dad226a5c05106a33c5b5b79d9d2cca0798a46ca@sha256:e0e6d3fc52f67797a0150ba5f7c798ef26be7c178c9b5fbe914f76f0eeb9a0ef
    entrypoint: [""]
  needs: [release:build]
  id_tokens:
    AZURE_FEDERATED_TOKEN:
      aud: api://AzureADTokenExchange
  script:
    - bash scripts/release/sign-windows.sh windows-amd64
    - bash scripts/release/sign-windows.sh windows-arm64
  artifacts:
    paths: [dist/signed/windows-amd64/, dist/signed/windows-arm64/]

release:macos-sign:
  extends: .release-macos
  stage: sign
  needs: [release:build]
  script:
    - bash scripts/release/sign-macos.sh
  artifacts:
    paths: [dist/signed/darwin-amd64/, dist/signed/darwin-arm64/]

release:assemble:
  extends: .release-linux
  stage: assemble
  needs: [release:build, release:resources, security:offline-model, release:windows-sign, release:macos-sign]
  script:
    - source scripts/release/common.sh
    - require_release_identity
    - release_ci assemble "$release_version" "$release_commit"
  artifacts:
    paths: [dist/final/]

release:scan:
  extends: .release-linux
  stage: scan
  needs: [release:assemble]
  script:
    - bash scripts/release/scan.sh
  artifacts:
    when: always
    paths: [dist/final/]

release:verify-windows:
  extends: .release-linux
  stage: verify
  needs: [release:scan]
  script:
    - bash scripts/release/verify-platforms.sh windows

release:verify-macos:
  extends: .release-macos
  stage: verify
  needs: [release:scan]
  script:
    - bash scripts/release/verify-platforms.sh darwin

release:verify-linux:
  extends: .release-linux
  stage: verify
  needs: [release:scan]
  script:
    - bash scripts/release/verify-platforms.sh linux

release:attest:
  extends: .release-linux
  stage: attest
  needs: [release:scan, release:verify-windows, release:verify-macos, release:verify-linux]
  id_tokens:
    SIGSTORE_ID_TOKEN:
      aud: sigstore
  script:
    - bash scripts/release/sign-manifest.sh
  artifacts:
    paths: [dist/final/]

release:publish:
  extends: .release-linux
  stage: publish
  environment:
    name: release-publication
    action: prepare
  needs: [release:attest]
  resource_group: pptxgengo-release-publication
  script:
    - bash scripts/release/publish.sh
