stages: [test, security, build, sign, assemble, scan, verify, attest, publish]

include:
  - local: .gitlab/ci/release.yml
  - local: .gitlab/ci/native-cli.yml

variables:
  GOTOOLCHAIN: local
  PPTXGENGO_PACKAGE_KIND: cli-only
  PPTXGENGO_OFFLINE_MODEL: 'true'

# Branch pushes are filtered. GitLab MR events or the GitHub PR relay select
# focused PR checks; merged main gets all hermetic units, never races/installers.
workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" || ($CI_PIPELINE_SOURCE =~ /^(api|web)$/ && $PPTXGENGO_CI_TIER == "pr")'
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_COMMIT_TAG =~ /^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-rc\.[1-9][0-9]*)?$/ && $CI_COMMIT_REF_PROTECTED == "true"'
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_COMMIT_REF_PROTECTED == "true"'
    - if: '$CI_PIPELINE_SOURCE =~ /^(api|web)$/ && ($PPTXGENGO_CI_JOB != "" || $PPTXGENGO_WINDOWS_CLI == "true" || $PPTXGENGO_WINDOWS_ARM64_CLI == "true" || $PPTXGENGO_WINDOWS_NATIVE == "true" || $PPTXGENGO_MACOS_INTEL == "true" || $PPTXGENGO_FULL_TESTS == "true")'
    - when: never

developer:
  stage: test
  image: golang:1.27.1
  timeout: 10 minutes
  interruptible: true
  variables:
    GOMODCACHE: $CI_PROJECT_DIR/.cache/go-mod
    GOCACHE: $CI_PROJECT_DIR/.cache/go-build
    WMDS_BRANDING_ROOT: $CI_PROJECT_DIR/.cache/empty-branding
    PPTXGENGO_NATIVE_LIVE_OUT: ''
  cache:
    key:
      files: [go.mod, go.sum]
      prefix: go-linux-fast-v1
    paths: [.cache/go-mod, .cache/go-build]
  before_script:
    - mkdir -p "$WMDS_BRANDING_ROOT"
  script:
    - make test
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_COMMIT_TAG =~ /^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-rc\.[1-9][0-9]*)?$/ && $CI_COMMIT_REF_PROTECTED == "true"'
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_COMMIT_REF_PROTECTED == "true"'
    - if: '$CI_PIPELINE_SOURCE =~ /^(api|web)$/ && ($PPTXGENGO_CI_JOB == "full" || $PPTXGENGO_CI_JOB == "developer")'
    - when: never

pr-unit:
  extends: developer
  timeout: 5 minutes
  cache:
    policy: pull
    key:
      files: [go.mod, go.sum]
      prefix: go-linux-fast-v1
    paths: [.cache/go-mod, .cache/go-build]
  script:
    - test -z "${PPTXGENGO_PR_HEAD:-}" || test "$CI_COMMIT_SHA" = "$PPTXGENGO_PR_HEAD"
    - make test-pr
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" || ($CI_PIPELINE_SOURCE =~ /^(api|web)$/ && $PPTXGENGO_CI_TIER == "pr")'
    - when: never

pr-relay-unit:
  stage: test
  image: python:3.13.8-alpine@sha256:3a77fbbb5bc88c0f63cc2692a13b011547f25ee93536e991544c452801856226
  timeout: 2 minutes
  interruptible: true
  script:
    - python3 -B -m unittest discover -s scripts/ci -p 'test_github_pr_poller.py'
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" || ($CI_PIPELINE_SOURCE =~ /^(api|web)$/ && $PPTXGENGO_CI_TIER == "pr")'
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_COMMIT_TAG =~ /^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-rc\.[1-9][0-9]*)?$/ && $CI_COMMIT_REF_PROTECTED == "true"'
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_COMMIT_REF_PROTECTED == "true"'
    - if: '$CI_PIPELINE_SOURCE =~ /^(api|web)$/ && ($PPTXGENGO_CI_JOB == "full" || $PPTXGENGO_CI_JOB == "pr-relay-unit")'
    - when: never

developer-race:
  extends: developer
  # Keep instrumented builds out of the everyday short-suite cache.
  cache:
    key:
      files: [go.mod, go.sum]
      prefix: go-linux-race-v1
    paths: [.cache/go-mod, .cache/go-build]
  # Retain separate per-package ceilings; do not increase them to hide a stall.
  timeout: 20 minutes
  script:
    - make test-race
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_COMMIT_REF_PROTECTED == "true"'
    - if: '$CI_PIPELINE_SOURCE =~ /^(api|web)$/ && ($PPTXGENGO_CI_JOB == "full" || $PPTXGENGO_CI_JOB == "developer-race")'
    - when: never

installation-process:
  stage: test
  image: golang:1.27.1
  timeout: 10 minutes
  interruptible: true
  variables:
    CGO_ENABLED: '0'
    GOMODCACHE: $CI_PROJECT_DIR/.cache/go-mod
    GOCACHE: $CI_PROJECT_DIR/.cache/go-build
    PPTXGENGO_INSTALL_PROCESS_OUT: $CI_PROJECT_DIR/.cache/installation-process
    PPTXGENGO_INSTALL_PROCESS_COMMIT: $CI_COMMIT_SHA
  cache:
    policy: pull
    key:
      files: [go.mod, go.sum]
      prefix: go-linux-fast-v1
    paths: [.cache/go-mod, .cache/go-build]
  script:
    - go test -count=1 -timeout=8m -run '^TestInstallationRealToolProcesses$' -v ./internal/installstate
  artifacts:
    when: on_success
    access: maintainer
    expire_in: 14 days
    paths: [.cache/installation-process/qualification.json]
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-rc\.[1-9][0-9]*)?$/ && $CI_COMMIT_REF_PROTECTED == "true"'
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_COMMIT_REF_PROTECTED == "true"'
    - if: '$CI_PIPELINE_SOURCE =~ /^(api|web)$/ && ($PPTXGENGO_CI_JOB == "full" || $PPTXGENGO_CI_JOB == "installation-process")'
    - when: never

installation-process-arm64:
  extends: installation-process
  tags: [linux, arm64, macmini-linux]
  cache:
    policy: pull
    key:
      files: [go.mod, go.sum]
      prefix: go-linux-arm64-native-v1
    paths: [.cache/go-mod, .cache/go-build]
  before_script:
    - test "$(go env GOHOSTARCH)" = arm64
    - go test -short -count=1 -timeout=150s ./scripts/cmd/search-benchmark ./internal/powershellenv
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-rc\.[1-9][0-9]*)?$/ && $CI_COMMIT_REF_PROTECTED == "true"'
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_COMMIT_REF_PROTECTED == "true"'
    - if: '$CI_PIPELINE_SOURCE =~ /^(api|web)$/ && ($PPTXGENGO_CI_JOB == "full" || $PPTXGENGO_CI_JOB == "installation-process-arm64")'
    - when: never

workflow-lint:
  stage: test
  image: golang:1.27.1
  timeout: 5 minutes
  interruptible: true
  # A pod startup failure does not execute CI validation. Retry infrastructure
  # failures only; lint/script failures remain terminal.
  retry:
    max: 2
    when: [runner_system_failure]
  script:
    - go run ./scripts/cmd/ci-lint
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" || ($CI_PIPELINE_SOURCE =~ /^(api|web)$/ && $PPTXGENGO_CI_TIER == "pr")'
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_COMMIT_TAG =~ /^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-rc\.[1-9][0-9]*)?$/ && $CI_COMMIT_REF_PROTECTED == "true"'
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_COMMIT_REF_PROTECTED == "true"'
    - if: '$CI_PIPELINE_SOURCE =~ /^(api|web)$/ && ($PPTXGENGO_CI_JOB == "full" || $PPTXGENGO_CI_JOB == "workflow-lint")'
    - when: never

offline-model:
  stage: test
  image: golang:1.27.1
  timeout: 15 minutes
  interruptible: true
  variables:
    CGO_ENABLED: '0'
    GOMODCACHE: $CI_PROJECT_DIR/.cache/go-mod
    GOCACHE: $CI_PROJECT_DIR/.cache/go-build
    PPTXGENGO_EMBED_MODEL_DIR: $CI_PROJECT_DIR/.cache/offline-model
    PPTXGENGO_SEARCH_BENCH_OUT: $CI_PROJECT_DIR/.cache/search-performance
    PPTXGENGO_SEARCH_BENCH_COMMIT: $CI_COMMIT_SHA
  cache:
    policy: pull
    key:
      files: [go.mod, go.sum]
      prefix: go-linux-fast-v1
    paths: [.cache/go-mod, .cache/go-build]
  script:
    - go run ./cmd/pptxdesign library-model --download --out "$PPTXGENGO_EMBED_MODEL_DIR"
    # Ordinary unit cases run once in developer; these require actual weights.
    - go test -count=1 -timeout=5m -run '^TestPinned(ModelGolden|PackageOfflineCopy|ModelPackageClosure|OfflineModelReleaseReproducibleAndRelocatable)$' ./internal/localembed ./internal/modelpackage ./scripts/cmd/release-ci

  artifacts:
    when: on_success
    access: maintainer
    expire_in: 14 days
    paths: [.cache/offline-model/, .cache/search-performance/]
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-rc\.[1-9][0-9]*)?$/ && $CI_COMMIT_REF_PROTECTED == "true"'
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_COMMIT_REF_PROTECTED == "true"'
    - if: '$CI_PIPELINE_SOURCE =~ /^(api|web)$/ && ($PPTXGENGO_CI_JOB == "full" || $PPTXGENGO_CI_JOB == "offline-model" || $PPTXGENGO_CI_JOB == "search-performance" || $PPTXGENGO_CI_JOB == "security:offline-model")'
    - when: never

offline-model-arm64:
  extends: offline-model
  tags: [linux, arm64, macmini-linux]
  # The only ARM cache writer; installer jobs consume it without uploading.
  cache:
    policy: pull-push
    key:
      files: [go.mod, go.sum]
      prefix: go-linux-arm64-native-v1
    paths: [.cache/go-mod, .cache/go-build]
  before_script:
    - test "$(go env GOHOSTARCH)" = arm64
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_COMMIT_REF_PROTECTED == "true"'
    - if: '$CI_PIPELINE_SOURCE =~ /^(api|web)$/ && ($PPTXGENGO_CI_JOB == "full" || $PPTXGENGO_CI_JOB == "offline-model-arm64" || $PPTXGENGO_CI_JOB == "search-performance-arm64")'
    - when: never

search-performance:
  extends: offline-model
  needs: [offline-model]
  script:
    - go test -count=1 -timeout=8m -run '^TestPinnedLibraryEmbeddingsEndToEnd$' ./internal/wmdesign
    - go test -count=1 -timeout=7m -run '^TestPinnedLibrarySearchPerformance$' -v ./internal/wmdesign
  artifacts:
    when: on_success
    access: maintainer
    expire_in: 14 days
    paths: [.cache/search-performance/]
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_COMMIT_REF_PROTECTED == "true"'
    - if: '$CI_PIPELINE_SOURCE =~ /^(api|web)$/ && ($PPTXGENGO_CI_JOB == "full" || $PPTXGENGO_CI_JOB == "search-performance")'
    - when: never

search-performance-arm64:
  extends: search-performance
  tags: [linux, arm64, macmini-linux]
  needs: [offline-model-arm64]
  cache:
    policy: pull
    key:
      files: [go.mod, go.sum]
      prefix: go-linux-arm64-native-v1
    paths: [.cache/go-mod, .cache/go-build]
  before_script:
    - test "$(go env GOHOSTARCH)" = arm64
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_COMMIT_REF_PROTECTED == "true"'
    - if: '$CI_PIPELINE_SOURCE =~ /^(api|web)$/ && ($PPTXGENGO_CI_JOB == "full" || $PPTXGENGO_CI_JOB == "search-performance-arm64")'
    - when: never

exhaustive:
  stage: test
  tags: [pptxgengo-integration]
  timeout: 20 minutes
  interruptible: true
  parallel:
    matrix:
      - TEST_TARGET: [test-integration, test-race-full]
  variables:
    PPTXGENGO_NATIVE_LIVE_OUT: ''
  rules:
    - if: '$PPTXGENGO_FULL_TESTS == "true" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_COMMIT_REF_PROTECTED == "true" && $CI_PIPELINE_SOURCE == "schedule"'
    - if: '$PPTXGENGO_FULL_TESTS == "true" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_COMMIT_REF_PROTECTED == "true" && $CI_PIPELINE_SOURCE == "web"'
      when: manual
      allow_failure: false
    - when: never
  script:
    - make "$TEST_TARGET"

# Opt-in for the home-lab Windows shell runner. Run its agent from the signed-in
# desktop; a Session 0 Windows service cannot qualify PowerPoint automation.
windows-native:
  stage: test
  tags: [windows, pptxgengo-windows-native]
  timeout: 10 minutes
  interruptible: false
  rules:
    - if: '$PPTXGENGO_WINDOWS_NATIVE == "true" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_COMMIT_REF_PROTECTED == "true" && $CI_PIPELINE_SOURCE == "web"'
      when: manual
      allow_failure: false
    - when: never
  script:
    - '$env:CGO_ENABLED = "0"'
    - 'go build -trimpath -o bin/ ./cmd/pptxgengo ./cmd/pptxdesign ./cmd/wmdsdocs; if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }'
    - 'Copy-Item internal/releasepackage/smoke-test-windows.ps1 .'
    - 'powershell -NoProfile -ExecutionPolicy Bypass -File .\smoke-test-windows.ps1 -Native -Out "$env:CI_PROJECT_DIR\windows-native-results"; if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }'
    - '$env:PPTXGENGO_ROUNDTRIP_WINDOWS_OUT = "$env:CI_PROJECT_DIR\windows-native-results\roundtrip-$env:CI_JOB_ID"'
    - 'go test -count=1 -timeout=3m -run "^TestNativeRoundTripLiveWindows$" ./internal/deckproject; if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }'
  artifacts:
    when: always
    expire_in: 14 days
    paths: [windows-native-results/]

# These gates also run on ordinary branches, before a release tag is cut.
security:go:
  stage: security
  needs: []
  image:
    name: gitlab-registry.samcott.com/riscott/ci-images/vault-tools-release-security:v2-pinned-dad226a5c05106a33c5b5b79d9d2cca0798a46ca@sha256:3fbf2f78efe3e3c2bab885d9e15d21e769e92f8e53d47908c3532888c356752a
    entrypoint: [""]
  timeout: 15 minutes
  interruptible: true
  parallel:
    matrix:
      - GOOS: [linux, darwin, windows]
  variables:
    CGO_ENABLED: '0'
  before_script:
    - source scripts/release/use-linux-go.sh
  script:
    - bash scripts/release/scan-source.sh vulnerabilities
  artifacts:
    when: always
    access: maintainer
    expire_in: 14 days
    paths: [.cache/security/govulncheck-*.json]
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-rc\.[1-9][0-9]*)?$/ && $CI_COMMIT_REF_PROTECTED == "true"'
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_COMMIT_REF_PROTECTED == "true"'
    - if: '$CI_PIPELINE_SOURCE =~ /^(api|web)$/ && ($PPTXGENGO_CI_JOB == "full" || $PPTXGENGO_CI_JOB == "security:go")'
    - when: never

security:secrets:
  stage: security
  needs: []
  image:
    name: gitlab-registry.samcott.com/riscott/ci-images/vault-tools-release-security:v2-pinned-dad226a5c05106a33c5b5b79d9d2cca0798a46ca@sha256:3fbf2f78efe3e3c2bab885d9e15d21e769e92f8e53d47908c3532888c356752a
    entrypoint: [""]
  timeout: 15 minutes
  interruptible: true
  before_script:
    - source scripts/release/use-linux-go.sh
  script:
    - bash scripts/release/scan-source.sh secrets
  artifacts:
    when: always
    access: maintainer
    expire_in: 14 days
    paths: [.cache/security/gitleaks.json]


# Scan the separate optional model archive during full qualification.
# v0.0.0 identifies an unpublished validation fixture on untagged branches.
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" || ($CI_PIPELINE_SOURCE =~ /^(api|web)$/ && $PPTXGENGO_CI_TIER == "pr")'
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_COMMIT_TAG =~ /^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-rc\.[1-9][0-9]*)?$/ && $CI_COMMIT_REF_PROTECTED == "true"'
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_COMMIT_REF_PROTECTED == "true"'
    - if: '$CI_PIPELINE_SOURCE =~ /^(api|web)$/ && ($PPTXGENGO_CI_JOB == "full" || $PPTXGENGO_CI_JOB == "security:secrets")'
    - when: never

security:offline-model:
  stage: security
  needs: [offline-model]
  image:
    name: gitlab-registry.samcott.com/riscott/ci-images/vault-tools-release-security:v2-pinned-dad226a5c05106a33c5b5b79d9d2cca0798a46ca@sha256:3fbf2f78efe3e3c2bab885d9e15d21e769e92f8e53d47908c3532888c356752a
    entrypoint: [""]
  timeout: 15 minutes
  interruptible: true
  variables:
    PPTXGENGO_RELEASE_VERSION: v0.0.0
  before_script:
    - source scripts/release/use-linux-go.sh
  script:
    - source scripts/release/common.sh
    - release_ci model-package .cache/offline-model dist/model "$release_version" "$release_commit"
    - bash scripts/release/scan-model.sh dist/model "$release_version" "$release_commit"
  artifacts:
    when: always
    access: maintainer
    expire_in: 3 days
    paths: [dist/model/]
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-rc\.[1-9][0-9]*)?$/ && $CI_COMMIT_REF_PROTECTED == "true"'
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_COMMIT_REF_PROTECTED == "true"'
    - if: '$CI_PIPELINE_SOURCE =~ /^(api|web)$/ && ($PPTXGENGO_CI_JOB == "full" || $PPTXGENGO_CI_JOB == "security:offline-model")'
    - when: never
