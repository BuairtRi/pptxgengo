# Reviewed, suppression-free configuration for authoritative pptxgengo release scans.
# The release script runs Grype in a scrubbed environment, performs an explicit
# DB update, and rejects reports whose database is more than 120 hours old.
check-for-app-update: false
only-fixed: false
only-notfixed: false
ignore-wontfix: ""
fail-on-severity: ""
ignore: []
exclude: []
vex-documents: []
vex-add: []
show-suppressed: false
match-upstream-kernel-headers: true
db:
  auto-update: false
  validate-by-hash-on-start: true
  validate-age: true
  max-allowed-built-age: 120h
  require-update-check: true
