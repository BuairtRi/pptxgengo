title = "pptxgengo source secret scan"
[extend]
useDefault = true
[[allowlists]]
description = "Generated caches and release outputs are scanned separately"
paths = ['''(^|/)\.git/''', '''(^|/)\.cache/''', '''(^|/)dist/''', '''(^|/)node_modules/''']

[[allowlists]]
description = "Six reviewed template identifiers misclassified as API keys"
regexTarget = "match"
regexes = ['''"?key"?\s*:\s*"(?:deliverables/annotated|deliverables/walkthrough|funnel/compare|pdlc/observations|quadrant/subtle|stakeholders/quadrant)"''']

[[allowlists]]
description = "SHA-256 inventory fields for frozen source and native diagnostics"
regexTarget = "match"
regexes = ['''(?:tokens\.json|page_keys_sha256|native-access-(?:diagnose\.sh|diagnosis\.(?:md|json)|after-restart\.(?:md|json)))"\s*:\s*"[a-f0-9]{64}"''']
