name: Windows compatibility

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  portable:
    name: Windows portable CLI
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      CGO_ENABLED: '0'
      PPTXGENGO_NATIVE_LIVE_OUT: ''
      WMDS_BRANDING_ROOT: ${{ github.workspace }}/.cache/empty-branding
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Parse PowerShell scripts without executing installers or COM
        shell: pwsh
        run: |
          $scripts = @('internal/nativeexport/powerpoint.ps1', 'internal/nativeexport/roundtrip.ps1', 'internal/releasepackage/install-windows.ps1', 'internal/releasepackage/smoke-test-windows.ps1')
          foreach ($script in $scripts) {
            $tokens = $null; $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile((Join-Path $PWD $script), [ref]$tokens, [ref]$errors)
            if ($errors.Count -gt 0) { throw ($errors | Out-String) }
          }
      - name: Keyword search and index integrity regressions
        shell: pwsh
        run: |
          go test -count=1 -timeout=150s -run 'TestKeyword|TestDiscoveryRead' ./internal/wmdesign
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build Windows executables
        shell: pwsh
        run: |
          go build -trimpath -o bin/ ./cmd/pptxgengo ./cmd/pptxdesign ./cmd/wmdsdocs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\bin\pptxgengo.exe --version
          .\bin\pptxgengo.exe paths
      - name: Portable Go regression tests
        shell: pwsh
        run: |
          [void](New-Item -ItemType Directory -Path $env:WMDS_BRANDING_ROOT -Force)
          go test -short -count=1 -timeout=150s ./cmd/pptxgengo ./cmd/pptxdesign ./internal/deckproject ./internal/library ./internal/releasepackage ./internal/textlayout ./pptx
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          go test -short -count=1 -timeout=150s -run '^(TestWindows|TestSignedNativeReceiptRejectsHandmadeAndTamperedEvidence|TestConcurrentNative)' ./internal/nativeexport
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Installer staging, rollback and recovery regressions
        shell: pwsh
        run: |
          # These fixtures use temporary roots and --no-path; HKCU PATH and
          # font registrations are reserved for the desktop qualification lane.
          go test -count=1 -timeout=150s ./internal/installstate ./internal/finishedslide
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Relocated package-style smoke test without PowerPoint
        shell: pwsh
        run: |
          Copy-Item internal/releasepackage/smoke-test-windows.ps1 .
          powershell -NoProfile -ExecutionPolicy Bypass -File .\smoke-test-windows.ps1 -Out "$env:RUNNER_TEMP\pptxgengo smoke with spaces"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: windows-portable-results
          path: ${{ runner.temp }}\pptxgengo smoke with spaces

  native:
    name: Windows desktop PowerPoint qualification
    if: >-
      github.event_name == 'workflow_dispatch' &&
      vars.PPTXGENGO_WINDOWS_NATIVE == 'true' &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: [self-hosted, Windows, pptxgengo-windows-native]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Build and run native smoke test from the interactive desktop runner
        shell: powershell
        run: |
          $env:CGO_ENABLED = '0'
          go build -trimpath -o bin/ ./cmd/pptxgengo ./cmd/pptxdesign ./cmd/wmdsdocs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item internal/releasepackage/smoke-test-windows.ps1 .
          powershell -NoProfile -ExecutionPolicy Bypass -File .\smoke-test-windows.ps1 -Native -Out "$env:RUNNER_TEMP\pptxgengo native smoke"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Save As, edit three fields, reorder and verify the synthetic fixture
        shell: powershell
        run: |
          $env:PPTXGENGO_ROUNDTRIP_WINDOWS_OUT = "$env:RUNNER_TEMP\pptxgengo roundtrip $env:GITHUB_RUN_ID $env:GITHUB_RUN_ATTEMPT"
          go test -count=1 -timeout=3m -run '^TestNativeRoundTripLiveWindows$' ./internal/deckproject
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: windows-native-results
          path: |
            ${{ runner.temp }}\pptxgengo native smoke
            ${{ runner.temp }}\pptxgengo roundtrip*
